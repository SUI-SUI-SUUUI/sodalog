<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>そだログ</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <style>
      :root {
        color: #263326;
        background: #f7faf7;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      * { box-sizing: border-box; }

      body { margin: 0; padding: 20px 16px 40px; }

      main { max-width: 520px; margin: 0 auto; }

      .card {
        padding: 24px 20px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
      }

      h1 { margin: 0 0 8px; font-size: 24px; }

      .description { margin: 0 0 24px; color: #586458; line-height: 1.6; }

      .field { margin-bottom: 20px; }

      label, .field-title { display: block; margin-bottom: 8px; font-weight: 700; }

      input, select, textarea, button {
        width: 100%; padding: 12px; border-radius: 10px; font: inherit;
      }

      input, select, textarea { border: 1px solid #cdd8cd; background: #fff; color: inherit; }

      textarea { min-height: 96px; resize: vertical; }

      .tasks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

      .task { margin: 0; font-weight: 400; }

      .task input { position: absolute; opacity: 0; pointer-events: none; }

      .task span { display: block; padding: 11px 8px; border: 1px solid #cdd8cd; border-radius: 10px; text-align: center; }

      .task input:checked + span { border-color: #4f7956; background: #e8f2e9; font-weight: 700; }

      button { margin-top: 12px; border: 0; font-weight: 700; cursor: pointer; }

      button:disabled { cursor: wait; opacity: .65; }

      .primary { background: #4f7956; color: #fff; }

      .secondary { border: 1px solid #4f7956; background: #fff; color: #3f6546; }

      .status { margin: 0 0 20px; padding: 10px 12px; border-radius: 10px; background: #eef6ee; white-space: pre-line; line-height: 1.5; }

      .status.error { color: #8b1f1f; background: #fff0f0; }

      .hidden { display: none; }

      .confirmation { margin: 0 0 24px; padding: 0; list-style: none; }

      .confirmation li { padding: 12px 0; border-bottom: 1px solid #e2e8e2; }

      .confirmation li:first-child { border-top: 1px solid #e2e8e2; }

      .label { display: block; margin-bottom: 4px; color: #687368; font-size: 13px; }

      .value { white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 700; }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0 0 16px;
      }

      .tab-button {
        padding: 12px 8px;
        border: 1px solid #cdd8cd;
        border-radius: 10px;
        background: #fff;
        color: #586458;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .tab-button.active {
        border-color: #4f7956;
        background: #e8f2e9;
        color: #263326;
      }

      .tab-panel.hidden { display: none; }

      .album-list { margin: 0; padding: 0; list-style: none; }

      .album-item { padding: 16px 0; border-bottom: 1px solid #e2e8e2; }

      .album-item:first-child { border-top: 1px solid #e2e8e2; }

      .album-group-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 4px;
        border-bottom: 1px solid #e2e8e2;
        cursor: pointer;
      }

      .album-group-item:first-child { border-top: 1px solid #e2e8e2; }

      .album-group-title { margin: 0 0 4px; font-weight: 700; }

      .album-group-meta { margin: 0; color: #687368; font-size: 13px; }

      .album-group-arrow { color: #9aa79a; font-size: 20px; }

      .album-back-button {
        width: auto;
        margin: 0 0 16px;
        padding: 8px 16px;
        border: 1px solid #4f7956;
        border-radius: 10px;
        background: #fff;
        color: #3f6546;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .album-breadcrumb { margin: 0 0 16px; color: #687368; font-size: 13px; }

      .album-refresh-button {
        width: auto;
        margin: 0 0 16px;
        padding: 6px 12px;
        border: 1px solid #cdd8cd;
        border-radius: 10px;
        background: #fff;
        color: #586458;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .album-date { margin: 0 0 4px; color: #687368; font-size: 13px; }

      .album-title { margin: 0 0 4px; font-weight: 700; }

      .album-meta { margin: 0 0 4px; color: #586458; font-size: 13px; }

      .album-task {
        display: inline-block;
        margin: 0 0 4px;
        padding: 4px 12px;
        border-radius: 999px;
        background: #eef6ee;
        color: #3f6546;
        font-size: 14px;
        font-weight: 700;
      }

      .album-memo { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

      .album-photo-badge {
        display: inline-block;
        margin-top: 8px;
        padding: 3px 10px;
        border-radius: 999px;
        background: #e8f2e9;
        color: #3f6546;
        font-size: 12px;
        font-weight: 700;
      }

      .album-photo {
        display: block;
        margin-top: 10px;
        max-width: 100%;
        border-radius: 10px;
        cursor: zoom-in;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(20, 26, 20, .9);
        z-index: 100;
      }

      .modal-overlay.hidden { display: none; }

      .modal-image {
        max-width: 100%;
        max-height: 100%;
        border-radius: 10px;
      }

      .modal-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #263326;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tabbar">
        <button class="tab-button active" type="button" data-tab="record">①記録する</button>
        <button class="tab-button" type="button" data-tab="album">②アルバム</button>
        <button class="tab-button" type="button" data-tab="consult">③相談</button>
      </div>

      <div id="recordTab" class="tab-panel">
        <section id="formScreen" class="card">
          <h1>園芸記録を追加</h1>
          <p class="description">今日の作業内容を入力してください。</p>
          <p id="status" class="status">LINEとの接続を確認しています。</p>

          <form id="gardenLogForm">
            <div class="field">
              <label for="workDate">作業日</label>
              <input id="workDate" type="date" required>
            </div>
            <div class="field">
              <label for="base">育成拠点</label>
              <select id="base" required>
                <option value="">選択してください</option>
                <option value="自宅">自宅</option>
              </select>
            </div>
            <div class="field">
              <label for="place">場所</label>
              <select id="place" required>
                <option value="">選択してください</option>
                <option value="庭">庭</option>
                <option value="室内">室内</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div class="field">
              <label for="detailPlace">詳細場所</label>
              <select id="detailPlace">
                <option value="">省略する</option>
                <option value="北側">北側</option>
                <option value="南側">南側</option>
                <option value="中央">中央</option>
                <option value="東側">東側</option>
                <option value="西側">西側</option>
              </select>
            </div>
            <div class="field">
              <label for="plant">植物名</label>
              <input id="plant" type="text" placeholder="例：アジサイ" required>
            </div>
            <div class="field">
              <span class="field-title">作業内容</span>
              <div class="tasks">
                <label class="task"><input type="radio" name="task" value="水やり" required><span>水やり</span></label>
                <label class="task"><input type="radio" name="task" value="肥料"><span>肥料</span></label>
                <label class="task"><input type="radio" name="task" value="収穫"><span>収穫</span></label>
                <label class="task"><input type="radio" name="task" value="剪定"><span>剪定</span></label>
                <label class="task"><input type="radio" name="task" value="草取り"><span>草取り</span></label>
                <label class="task"><input type="radio" name="task" value="植え付け"><span>植え付け</span></label>
                <label class="task"><input type="radio" name="task" value="成長記録"><span>成長記録</span></label>
                <label class="task"><input type="radio" name="task" value="その他"><span>その他</span></label>
              </div>
            </div>
            <div class="field">
              <label for="memo">メモ</label>
              <textarea id="memo" placeholder="省略できます"></textarea>
            </div>
            <button class="primary" type="submit">内容を確認する</button>
          </form>
        </section>

        <section id="confirmationScreen" class="card hidden">
          <h1>入力内容の確認</h1>
          <p class="description">この内容でLINEに送信して記録しますか？</p>
          <ul id="confirmation" class="confirmation"></ul>
          <button id="saveButton" class="primary" type="button">LINEへ送信して記録する</button>
          <button id="backButton" class="secondary" type="button">入力画面に戻る</button>
          <p id="confirmationStatus" class="status hidden"></p>
        </section>
      </div>

      <div id="albumTab" class="tab-panel hidden">
        <section class="card">
          <button id="albumBackButton" class="album-back-button hidden" type="button">＜ 戻る</button>
          <h1 id="albumTitle">アルバム</h1>
          <p id="albumBreadcrumb" class="album-breadcrumb hidden"></p>
          <p id="albumDescription" class="description">場所を選ぶと、その場所の植物ごとに記録を振り返れます。</p>
          <button id="albumRefreshButton" class="album-refresh-button" type="button">🔄 最新の記録に更新</button>
          <p id="albumStatus" class="status">読み込み中です。</p>
          <ul id="albumList" class="album-list"></ul>
        </section>
      </div>

      <div id="consultTab" class="tab-panel hidden">
        <section class="card">
          <h1>相談</h1>
          <p class="description">準備中です。</p>
        </section>
      </div>

      <div id="photoModal" class="modal-overlay hidden">
        <button id="photoModalClose" class="modal-close" type="button" aria-label="閉じる">×</button>
        <img id="photoModalImage" class="modal-image" alt="">
      </div>
    </main>

    <script>
      const LIFF_ID = "2010871516-DJ2YSRIw";
      const WEBAPP_URL =
        "https://script.google.com/macros/s/AKfycbzz73ibrR35BIh5cWmkn8bNQO3AxgtHQItgqyFaeDzpJqj2pMXN04IFbI9xkcOijLUy/exec";
      const formScreen = document.getElementById("formScreen");
      const confirmationScreen = document.getElementById("confirmationScreen");
      const form = document.getElementById("gardenLogForm");
      const status = document.getElementById("status");
      const confirmationStatus = document.getElementById("confirmationStatus");

      function setStatus(message, isError) {
        status.textContent = message;
        status.classList.toggle("error", Boolean(isError));
      }

      function setToday() {
        document.getElementById("workDate").value = new Date(
          Date.now() - new Date().getTimezoneOffset() * 60000,
        ).toISOString().slice(0, 10);
      }

      function getData() {
        const selectedTask = document.querySelector('input[name="task"]:checked');
        return {
          workDate: document.getElementById("workDate").value,
          base: document.getElementById("base").value,
          place: document.getElementById("place").value,
          detailPlace: document.getElementById("detailPlace").value,
          plant: document.getElementById("plant").value.trim(),
          task: selectedTask ? selectedTask.value : "",
          memo: document.getElementById("memo").value.trim(),
        };
      }

      function formatDate(value) {
        const parts = value.split("-");
        return parts.length === 3
          ? parts[0] + "年" + Number(parts[1]) + "月" + Number(parts[2]) + "日"
          : value;
      }

      function showConfirmation(data) {
        const entries = [
          ["作業日", formatDate(data.workDate)],
          ["育成拠点", data.base],
          ["場所", data.place],
          ["詳細場所", data.detailPlace || "省略"],
          ["植物名", data.plant],
          ["作業内容", data.task],
          ["メモ", data.memo || "なし"],
        ];
        const list = document.getElementById("confirmation");
        list.replaceChildren();
        entries.forEach(function (entry) {
          const item = document.createElement("li");
          const label = document.createElement("span");
          const value = document.createElement("span");
          label.className = "label";
          value.className = "value";
          label.textContent = entry[0];
          value.textContent = entry[1];
          item.append(label, value);
          list.append(item);
        });
        confirmationStatus.classList.add("hidden");
        formScreen.classList.add("hidden");
        confirmationScreen.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function buildMessage(data) {
        const values = [
          data.workDate.replace(/-/g, "/"),
          data.base,
          data.place,
          data.detailPlace,
          data.plant,
          data.task,
          data.memo,
        ];
        if (values.some(function (value) { return value.includes("_"); })) {
          throw new Error("「_」は入力できません。別の記号に置き換えてください。");
        }
        return values.join("_");
      }

      async function initializeLiff() {
        try {
          await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });
          if (!liff.isLoggedIn()) {
            setStatus("LINEログインを開始します。");
            liff.login();
            return;
          }
          setStatus("入力内容をLINEに送信して記録します。");
        } catch (error) {
          console.error("LIFF初期化エラー", error);
          setStatus("LINEとの接続に失敗しました。LINEアプリから開き直してください。", true);
        }
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (form.reportValidity()) {
          showConfirmation(getData());
        }
      });

      document.getElementById("backButton").addEventListener("click", function () {
        confirmationScreen.classList.add("hidden");
        formScreen.classList.remove("hidden");
      });

      document.getElementById("saveButton").addEventListener("click", async function () {
        const button = this;
        confirmationStatus.classList.remove("hidden", "error");
        button.disabled = true;
        button.textContent = "LINEへ送信しています…";
        try {
          if (!liff.isLoggedIn()) {
            throw new Error("LINEにログインしていません。LINEアプリから開き直してください。");
          }
          await liff.sendMessages([{ type: "text", text: buildMessage(getData()) }]);
          confirmationStatus.textContent = "送信しました。トークに届く「記録しました」のメッセージを確認してください。";
          button.textContent = "送信完了";
          document.getElementById("backButton").classList.add("hidden");
        } catch (error) {
          console.error("LIFF送信エラー", error);
          confirmationStatus.classList.add("error");
          confirmationStatus.textContent = error.message || "送信に失敗しました。LINEのトークから開き直してください。";
          button.disabled = false;
          button.textContent = "LINEへ送信して記録する";
        }
      });

      setToday();
      initializeLiff();

      function formatSlashDate(value) {
        const parts = String(value || "").split("/");
        return parts.length === 3
          ? parts[0] + "年" + Number(parts[1]) + "月" + Number(parts[2]) + "日"
          : value;
      }

      const TASK_ICONS = {
        水やり: "💧",
        肥料: "🧪",
        収穫: "🌾",
        剪定: "✂️",
        草取り: "🌿",
        植え付け: "🌱",
        成長記録: "📷",
      };

      function taskIcon(task) {
        return TASK_ICONS[task] || "🔖";
      }

      function renderAlbumRecords(records) {
        const list = document.getElementById("albumList");
        list.replaceChildren();

        records.forEach(function (record) {
          const item = document.createElement("li");
          item.className = "album-item";

          const date = document.createElement("p");
          date.className = "album-date";
          date.textContent = formatSlashDate(record.workDate);

          const task = document.createElement("p");
          task.className = "album-task";
          task.textContent = taskIcon(record.task) + " " + (record.task || "記録");

          item.append(date, task);

          if (record.memo) {
            const memo = document.createElement("p");
            memo.className = "album-memo";
            memo.textContent = record.memo;
            item.append(memo);
          }

          if (record.hasImage && record.imageFileId) {
            const badge = document.createElement("span");
            badge.className = "album-photo-badge";
            badge.textContent = "📷 読み込み中…";
            item.append(badge);

            loadAlbumImage(record.imageFileId, badge, item);
          } else if (record.hasImage) {
            const badge = document.createElement("span");
            badge.className = "album-photo-badge";
            badge.textContent = "📷 写真あり";
            item.append(badge);
          }

          list.append(item);
        });
      }

      const PLACE_ORDER = ["庭", "室内", "その他"];
      const DETAIL_ORDER = ["北側", "南側", "中央", "東側", "西側"];

      function placeLabel(place) {
        return place || "場所未設定";
      }

      function plantLabel(plant) {
        return plant || "植物名未設定";
      }

      function zoneDisplayLabel(place, detailPlace) {
        return detailPlace ? place + "・" + detailPlace : place;
      }

      function orderIndex(list, value) {
        const index = list.indexOf(value);
        return index === -1 ? list.length : index;
      }

      function compareZones(a, b) {
        const placeDiff = orderIndex(PLACE_ORDER, a.place) - orderIndex(PLACE_ORDER, b.place);
        if (placeDiff !== 0) {
          return placeDiff;
        }
        if (!a.detailPlace && !b.detailPlace) {
          return 0;
        }
        if (!a.detailPlace) {
          return -1;
        }
        if (!b.detailPlace) {
          return 1;
        }
        const detailDiff =
          orderIndex(DETAIL_ORDER, a.detailPlace) - orderIndex(DETAIL_ORDER, b.detailPlace);
        if (detailDiff !== 0) {
          return detailDiff;
        }
        return a.detailPlace.localeCompare(b.detailPlace, "ja");
      }

      function buildGroupItem(title, meta) {
        const item = document.createElement("li");
        item.className = "album-group-item";

        const text = document.createElement("div");
        const titleEl = document.createElement("p");
        titleEl.className = "album-group-title";
        titleEl.textContent = title;
        const metaEl = document.createElement("p");
        metaEl.className = "album-group-meta";
        metaEl.textContent = meta;
        text.append(titleEl, metaEl);

        const arrow = document.createElement("span");
        arrow.className = "album-group-arrow";
        arrow.textContent = "›";

        item.append(text, arrow);
        return item;
      }

      function setAlbumHeader(title, breadcrumbText, showBack, onBack) {
        document.getElementById("albumTitle").textContent = title;

        const breadcrumb = document.getElementById("albumBreadcrumb");
        if (breadcrumbText) {
          breadcrumb.textContent = breadcrumbText;
          breadcrumb.classList.remove("hidden");
        } else {
          breadcrumb.classList.add("hidden");
        }

        document.getElementById("albumDescription").classList.toggle(
          "hidden",
          Boolean(breadcrumbText),
        );

        const backButton = document.getElementById("albumBackButton");
        backButton.classList.toggle("hidden", !showBack);
        backButton.onclick = onBack || null;
      }

      function renderAlbumZones() {
        setAlbumHeader("アルバム", "", false, null);

        const zoneMap = new Map();
        albumRecords.forEach(function (record) {
          const place = placeLabel(record.place);
          const detailPlace = record.detailPlace || "";
          const key = place + "␀" + detailPlace;
          if (!zoneMap.has(key)) {
            zoneMap.set(key, {
              place: place,
              detailPlace: detailPlace,
              count: 0,
              latestDate: record.workDate,
            });
          }
          zoneMap.get(key).count += 1;
        });

        const zones = Array.from(zoneMap.values()).sort(compareZones);

        const list = document.getElementById("albumList");
        list.replaceChildren();

        zones.forEach(function (zone) {
          const item = buildGroupItem(
            zoneDisplayLabel(zone.place, zone.detailPlace),
            zone.count + "件・最新 " + formatSlashDate(zone.latestDate),
          );
          item.addEventListener("click", function () {
            renderAlbumPlants(zone.place, zone.detailPlace);
          });
          list.append(item);
        });
      }

      function renderAlbumPlants(place, detailPlace) {
        const zoneName = zoneDisplayLabel(place, detailPlace);
        setAlbumHeader(zoneName + "の植物", zoneName, true, renderAlbumZones);

        const plantMap = new Map();
        albumRecords
          .filter(function (record) {
            return (
              placeLabel(record.place) === place &&
              (record.detailPlace || "") === detailPlace
            );
          })
          .forEach(function (record) {
            const key = plantLabel(record.plant);
            if (!plantMap.has(key)) {
              plantMap.set(key, { count: 0, latestDate: record.workDate });
            }
            plantMap.get(key).count += 1;
          });

        const list = document.getElementById("albumList");
        list.replaceChildren();

        Array.from(plantMap.keys())
          .sort(function (a, b) {
            return a.localeCompare(b, "ja");
          })
          .forEach(function (plant) {
            const info = plantMap.get(plant);
            const item = buildGroupItem(
              plant,
              info.count + "件・最新 " + formatSlashDate(info.latestDate),
            );
            item.addEventListener("click", function () {
              renderAlbumRecordsFiltered(place, detailPlace, plant);
            });
            list.append(item);
          });
      }

      function renderAlbumRecordsFiltered(place, detailPlace, plant) {
        const zoneName = zoneDisplayLabel(place, detailPlace);
        setAlbumHeader(plant, zoneName + " › " + plant, true, function () {
          renderAlbumPlants(place, detailPlace);
        });

        const filtered = albumRecords.filter(function (record) {
          return (
            placeLabel(record.place) === place &&
            (record.detailPlace || "") === detailPlace &&
            plantLabel(record.plant) === plant
          );
        });

        renderAlbumRecords(filtered);
      }

      const photoModal = document.getElementById("photoModal");
      const photoModalImage = document.getElementById("photoModalImage");

      function openPhotoModal(src) {
        photoModalImage.src = src;
        photoModal.classList.remove("hidden");
      }

      function closePhotoModal() {
        photoModal.classList.add("hidden");
        photoModalImage.src = "";
      }

      document.getElementById("photoModalClose").addEventListener("click", closePhotoModal);

      document.getElementById("albumRefreshButton").addEventListener("click", function () {
        loadAlbum(true);
      });

      photoModal.addEventListener("click", function (event) {
        if (event.target === photoModal) {
          closePhotoModal();
        }
      });

      async function loadAlbumImage(fileId, badgeElement, itemElement) {
        try {
          const idToken = liff.getIDToken();
          const response = await fetch(
            WEBAPP_URL +
              "?action=image&fileId=" +
              encodeURIComponent(fileId) +
              "&idToken=" +
              encodeURIComponent(idToken),
          );
          const data = await response.json();

          if (!data.success) {
            badgeElement.textContent = "📷 画像を表示できません";
            return;
          }

          const img = document.createElement("img");
          img.className = "album-photo";
          img.alt = "";
          img.src = "data:" + data.mimeType + ";base64," + data.base64;
          img.addEventListener("click", function () {
            openPhotoModal(img.src);
          });
          itemElement.insertBefore(img, badgeElement);
          badgeElement.remove();
        } catch (error) {
          console.error("画像取得エラー", error);
          badgeElement.textContent = "📷 画像を表示できません";
        }
      }

      let albumLoading = false;
      let albumRecords = [];

      async function loadAlbum(forceRefresh) {
        if (albumLoading) {
          return;
        }

        /*
         * タブを行き来するたびに毎回スプレッドシート全件を読み直すと
         * 遅いため、既に読み込み済みならキャッシュを使い回す。
         * 記録を追加した直後などは「更新」ボタンで明示的に取り直す。
         */
        if (!forceRefresh && albumRecords.length > 0) {
          return;
        }

        albumLoading = true;

        const albumStatus = document.getElementById("albumStatus");
        albumStatus.classList.remove("error");
        albumStatus.textContent = "読み込み中です。";
        document.getElementById("albumList").replaceChildren();

        try {
          if (!liff.isLoggedIn()) {
            throw new Error("LINEにログインしていません。LINEアプリから開き直してください。");
          }

          const idToken = liff.getIDToken();
          const response = await fetch(
            WEBAPP_URL + "?action=list&idToken=" + encodeURIComponent(idToken),
          );
          const data = await response.json();

          if (!data.success) {
            throw new Error(data.message || "記録を取得できませんでした。");
          }

          if (data.records.length === 0) {
            albumStatus.textContent = "まだ記録がありません。";
            return;
          }

          albumStatus.textContent = "";
          albumRecords = data.records;
          renderAlbumZones();
        } catch (error) {
          console.error("アルバム取得エラー", error);
          albumStatus.classList.add("error");
          albumStatus.textContent =
            error.message || "記録を取得できませんでした。時間をおいて開き直してください。";
        } finally {
          albumLoading = false;
        }
      }

      const tabPanels = {
        record: document.getElementById("recordTab"),
        album: document.getElementById("albumTab"),
        consult: document.getElementById("consultTab"),
      };

      function activateTab(tabKey) {
        if (!tabPanels[tabKey]) {
          return;
        }

        document.querySelectorAll(".tab-button").forEach(function (button) {
          button.classList.toggle("active", button.dataset.tab === tabKey);
        });

        Object.keys(tabPanels).forEach(function (key) {
          tabPanels[key].classList.toggle("hidden", key !== tabKey);
        });

        if (tabKey === "album") {
          loadAlbum();
        }
      }

      document.querySelectorAll(".tab-button").forEach(function (button) {
        button.addEventListener("click", function () {
          activateTab(button.dataset.tab);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      const initialTab = new URLSearchParams(window.location.search).get("tab");
      if (initialTab) {
        activateTab(initialTab);
      }
    </script>
  </body>
</html>
