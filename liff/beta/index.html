      }

      // 記録を保存したら、その場所のアルバムは次に開いたときに取り直す
      function invalidateAlbum(locationId) {
        locationCounts = null;
        countsRequest++;
        Object.keys(album.cache).forEach(function (key) {
          if (key.indexOf(locationId + "|") === 0) {
            delete album.cache[key];
          }
        });
      }

      /*
       * 横スクロール: 指スワイプ・トラックパッドの横スワイプはブラウザ標準のまま。
       * マウスはホイール(縦の回転を横送りに。端まで来たら画面の縦スクロールに戻す)とドラッグで送る。
       */
      function enableHorizontalScroll(element, wrap) {
        function updateFade() {
          if (wrap) {
            const max = element.scrollWidth - element.clientWidth;
            wrap.classList.toggle("more-left", element.scrollLeft > 2);
            wrap.classList.toggle("more-right", element.scrollLeft < max - 2);
          }
        }
        element.addEventListener("wheel", function (event) {
          if (event.ctrlKey || event.metaKey) {
            return;
          }
          const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
          const max = element.scrollWidth - element.clientWidth;
          if (!delta || max <= 0 || (delta < 0 && element.scrollLeft <= 0) || (delta > 0 && element.scrollLeft >= max - 1)) {
            return;
          }
          event.preventDefault();
          element.scrollLeft += delta;
        }, { passive: false });

        let startX = 0;
        let startLeft = 0;
        let dragging = false;
        let moved = false;
        element.addEventListener("pointerdown", function (event) {
          if (event.pointerType !== "mouse" || event.button !== 0) {
            return;
          }
          dragging = true;
          moved = false;
          startX = event.clientX;
          startLeft = element.scrollLeft;
        });
        window.addEventListener("pointermove", function (event) {
          if (!dragging) {
            return;
          }
          const distance = event.clientX - startX;
          if (!moved && Math.abs(distance) > 4) {
            moved = true;
            element.classList.add("dragging");
          }
          if (moved) {
            element.scrollLeft = startLeft - distance;
          }
        });
        window.addEventListener("pointerup", function () {
          if (!dragging) {
            return;
          }
          dragging = false;
          element.classList.remove("dragging");
          if (moved) {
            // ドラッグで送ったときは、写真を押したことにしない
            element.suppressClick = true;
            setTimeout(function () { element.suppressClick = false; }, 0);
          }
        });
        element.addEventListener("click", function (event) {
          if (element.suppressClick) {
            event.stopPropagation();
            event.preventDefault();
          }
        }, true);
        element.addEventListener("scroll", updateFade, { passive: true });
        updateFade();
      }

      // ---- 一覧の写真の読み込み(見えてきたものから順に、同時に ALBUM_PHOTO_PARALLEL 枚まで) ----
      function pumpPhotos() {
        while (album.running < ALBUM_PHOTO_PARALLEL && album.queue.length) {
          const job = album.queue.shift();
          if (!job.tile.isConnected) {
            continue;
          }
          album.running++;
          fetchPhoto(job.fileId, "thumb")
            .then(function (blob) {
              thumbUrls[job.fileId] = URL.createObjectURL(blob);
              showThumb(job.tile, job.fileId);
            })
            .catch(function (error) {
              console.error("写真の読み込みエラー", error);
              if (job.tile.isConnected && !job.tile.querySelector(".failed")) {
                job.tile.append(el("span", "failed", "写真を読み込めませんでした"));
              }
            })
            .then(function () {
              album.running--;
              pumpPhotos();
            });
        }
      }

      function showThumb(tile, fileId) {
        const img = tile.querySelector("img");
        img.onload = function () { img.classList.add("loaded"); };
        img.src = thumbUrls[fileId];
      }

      function watchStrip(strip) {
        if (album.observer) {
          album.observer.disconnect();
        }
        album.queue = [];
        if (!("IntersectionObserver" in window)) {
          // 見えているかを判定できない古いブラウザでは、順番に全部読み込む
          strip.querySelectorAll(".ph").forEach(function (tile) {
            album.queue.push({ tile: tile, fileId: tile.dataset.fileId });
          });
          pumpPhotos();
          return;
        }
        album.observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) {
              return;
            }
            album.observer.unobserve(entry.target);
            const fileId = entry.target.dataset.fileId;
            if (thumbUrls[fileId]) {
              showThumb(entry.target, fileId);
            } else {
              album.queue.push({ tile: entry.target, fileId: fileId });
              pumpPhotos();
            }
          });
        }, { root: strip, rootMargin: "0px 120px" });
        strip.querySelectorAll(".ph").forEach(function (tile) { album.observer.observe(tile); });
      }

      // ---- 記録の詳細(先にサムネイルを表示し、元画像が届いたら差し替える) ----
      function openAlbumDetail(record) {
        if (document.querySelector(".detail-overlay")) {
          return;
        }
        const overlay = el("div", "detail-overlay");
        const sheet = el("div", "detail-sheet");
        sheet.setAttribute("role", "dialog");
        sheet.setAttribute("aria-modal", "true");
        sheet.setAttribute("aria-label", "記録の詳細");
        const top = el("div", "detail-top");

        const close = el("button", "cal-close");
        close.type = "button";
        close.innerHTML = '<span aria-hidden="true">×</span>閉じる';
        top.append(close);
        sheet.append(top);

        let fullUrl = null;
        if (record.photoFileId) {
          const box = el("div", "detail-photo");
          const img = el("img");
          img.alt = slashDate(record.workDate) + " の写真";
          if (thumbUrls[record.photoFileId]) {
            img.src = thumbUrls[record.photoFileId];
          }
          const hq = el("span", "hq", "高画質を読み込み中…");
          box.append(img, hq);
          sheet.append(box);
          fetchPhoto(record.photoFileId, "full")
            .then(function (blob) {
              if (!overlay.isConnected) {
                return;
              }
              fullUrl = URL.createObjectURL(blob);
              img.src = fullUrl;
              hq.remove();
            })
            .catch(function (error) {
              console.error("元画像の読み込みエラー", error);
              hq.textContent = img.getAttribute("src") ? "高画質を読み込めませんでした" : "写真を読み込めませんでした";
            });
        }

        const list = el("dl", "detail-list");
        function row(label, value) {
          const item = el("div");
          item.append(el("dt", "", label));
          const dd = el("dd");
          if (Array.isArray(value) && value.length) {
            value.forEach(function (v) { dd.append(el("div", "", v)); });
          } else if (!Array.isArray(value) && value) {
            dd.textContent = value;
          } else {
            dd.append(el("span", "none", "なし"));
          }
          item.append(dd);
          list.append(item);
        }
        row("作業日", slashDate(record.workDate));
        row("作業内容", record.workTypes);
        row("植物", record.plantTags.join("、"));
        row("メモ", record.memo);
        sheet.append(list);
        overlay.append(sheet);
        document.body.append(overlay);
        document.documentElement.classList.add("sheet-open");

        function hide() {
          overlay.remove();
          document.documentElement.classList.remove("sheet-open");
          document.removeEventListener("keydown", onKey);
          if (fullUrl) {
            URL.revokeObjectURL(fullUrl);
          }
        }
        function onKey(event) {
          if (event.key === "Escape") {
            hide();
          }
        }
        close.addEventListener("click", hide);
        overlay.addEventListener("click", function (event) {
          if (event.target === overlay) {
            hide();
          }
        });
        document.addEventListener("keydown", onKey);
        close.focus({ preventScroll: true });
      }

      // ---- 画面の組み立て ----
      function renderYears(data) {
        const container = document.getElementById("albumYears");
        container.replaceChildren();
        data.years.forEach(function (item) {
          const button = el("button", "", String(item.year));
          button.type = "button";
          button.append(el("small", "", item.count + "件"));
          button.setAttribute("aria-pressed", String(item.year === data.year));
          button.addEventListener("click", function () {
            if (item.year !== data.year) {
              loadAlbum(item.year);
            }
          });
          container.append(button);
        });
        // 左が過去・右が最新。右端(最新)が見える位置から(画面に追加済みなので、すぐに位置を決められる)
        container.scrollLeft = container.scrollWidth;
      }

      function renderPhotos(data) {
        const label = el("div", "section-label", "写真");
        label.append(el("small", "", data.photoRecords.length + "枚・右が最新"));
        albumBody.append(label);
        if (data.truncated.photo) {
          albumBody.append(el("p", "truncated-note", "この年は写真が多いため、新しい300件だけを表示しています。"));
        }
        if (!data.photoRecords.length) {
          albumBody.append(el("p", "album-empty", "この年の写真はありません"));
          return;
        }
        const wrap = el("div", "strip-wrap");
        const strip = el("div", "strip h-scroll");
        strip.setAttribute("aria-label", "写真の一覧（左が過去、右が最新）");
        data.photoRecords.forEach(function (record) {
          const tile = el("button", "ph");
          tile.type = "button";
          tile.dataset.fileId = record.photoFileId;
          tile.setAttribute("aria-label", slashDate(record.workDate) + " の写真" + (hasDetail(record) ? "（詳細あり）" : ""));
          const img = el("img");
          img.alt = "";
          img.draggable = false;
          tile.append(img, el("span", "date", record.workDate.slice(5).replace("-", "/")));
          if (hasDetail(record)) {
            const info = el("span", "info");
            info.innerHTML = INFO_ICON;
            tile.append(info);
          }
          // 写真のどこを押しても詳細を開く
          tile.addEventListener("click", function () { openAlbumDetail(record); });
          strip.append(tile);
        });
        wrap.append(strip);
        albumBody.append(wrap, el("p", "scroll-hint", "← 左が過去　右が最新 →"));
        // 開いた直後・年を変えたときは右端(最新)から。そのあとで、見えている写真から読み込む
        strip.scrollLeft = strip.scrollWidth;
        enableHorizontalScroll(strip, wrap);
        watchStrip(strip);
      }

      function renderTextTable(data) {
        const label = el("div", "section-label", "写真なしの記録");
        label.append(el("small", "", data.textRecords.length + "件・上が最新"));
        albumBody.append(label);
        if (data.truncated.text) {
          albumBody.append(el("p", "truncated-note", "この年は写真なしの記録が多いため、新しい300件だけを表示しています。"));
        }
        if (!data.textRecords.length) {
          albumBody.append(el("p", "album-empty", "この年の写真なしの記録はありません"));
          return;
        }
        const wrap = el("div", "album-table-wrap h-scroll");
        const table = el("table");
        table.innerHTML = '<thead><tr><th class="date-col">作業日</th><th>作業内容</th><th>植物</th><th>メモ</th></tr></thead>';
        const body = el("tbody");
        data.textRecords.forEach(function (record) {
          const tr = el("tr");
          tr.append(el("td", "date-col", slashDate(record.workDate)));
          const works = el("td", "works");
          if (record.workTypes.length) {
            record.workTypes.forEach(function (w) { works.append(el("div", "", w)); });
          } else {
            works.append(el("span", "none", "—"));
          }
          const tags = el("td", "tags-col");
          if (record.plantTags.length) {
            tags.textContent = record.plantTags.join("、");
          } else {
            tags.append(el("span", "none", "—"));
          }
          const memo = el("td", "memo-col");
          if (record.memo) {
            memo.textContent = record.memo;
          } else {
            memo.append(el("span", "none", "—"));
          }
          tr.append(works, tags, memo);
          body.append(tr);
        });
        table.append(body);
        wrap.append(table);
        albumBody.append(wrap);
        enableHorizontalScroll(wrap, null);
      }

      function renderAlbumData(data) {
        const place = document.getElementById("albumPlace");
        place.replaceChildren(document.createTextNode(data.location.name), el("span", "count", data.total + "件"));
        renderYears(data);
        albumBody.replaceChildren();
        if (data.year === null) {
          albumBody.append(el("p", "album-status", "この場所の記録はまだありません。「記録する」から記録すると、ここで振り返れます。"));
          return;
        }
        renderPhotos(data);
        renderTextTable(data);
      }

      function albumErrorMessage(error) {
        if (error instanceof ApiError) {
          if (error.status === 401) {
            return "LINEの認証が切れました。LINEから開き直してください。";
          }
          if (error.code === "unknown_location") {
            return "この場所が見つかりませんでした。場所を選び直してください。";
          }
        }
        return "アルバムを読み込めませんでした。通信状況を確認してください。";
      }

      async function loadAlbum(year) {
        const location = album.location;
        const requestId = ++album.request;
        const key = location.id + "|" + (year || "");
        if (!album.cache[key]) {
          albumBody.replaceChildren(el("p", "album-status", "読み込み中です。"));
        }
        try {
          let data = album.cache[key];
          if (!data) {
            data = await api("GET", "/api/album?locationId=" + encodeURIComponent(location.id) + (year ? "&year=" + year : ""));
            album.cache[key] = data;
            album.cache[location.id + "|" + data.year] = data;
          }
          if (requestId !== album.request || albumScreen.classList.contains("hidden")) {
            return;
          }
          renderAlbumData(data);
        } catch (error) {
          console.error("アルバムの取得エラー", error);
          if (requestId !== album.request) {
            return;
          }
          const status = el("div", "album-status error", albumErrorMessage(error));
          const retry = el("button", "", "もう一度読み込む");
          retry.type = "button";
          retry.addEventListener("click", function () { loadAlbum(year); });
          status.append(retry);
          albumBody.replaceChildren(status);
        }
      }

      function openAlbum(location) {
        album.location = location;
        applyTone(toneFor(location.id));
        const place = document.getElementById("albumPlace");
        place.replaceChildren(document.createTextNode(location.name));
        document.getElementById("albumYears").replaceChildren();
        pickerScreen.classList.add("hidden");
        recordScreen.classList.add("hidden");
        albumScreen.classList.remove("hidden");
        document.body.classList.add("toned");
        window.scrollTo(0, 0);
        loadAlbum(null);
      }

      function leaveAlbum() {
        album.request++;
        if (album.observer) {
          album.observer.disconnect();
        }
        album.queue = [];
        showPicker();
      }

      document.getElementById("albumChangePlace").addEventListener("click", leaveAlbum);

      // 相談(準備中): 画面は変えず、押したナビゲーションの下に案内を出す。「閉じる」か5秒で消える
      let consultTimer = null;

      function showConsultNote(nav) {
        document.querySelectorAll(".consult-note").forEach(function (note) { note.remove(); });
        const note = el("div", "consult-note");
        note.setAttribute("role", "status");
        note.append(el("b", "", "相談は準備中です"), document.createTextNode("今後、記録をもとに相談できるようになる予定です。"));
        const close = el("button", "", "閉じる");
        close.type = "button";
        close.addEventListener("click", function () { note.remove(); });
        note.append(close);
        note.style.top = (nav.offsetTop + nav.offsetHeight + 8) + "px";
        nav.parentElement.append(note);
        clearTimeout(consultTimer);
        consultTimer = setTimeout(function () { note.remove(); }, 5000);
      }

      // 3機能のナビゲーション(場所を選ぶ画面とアルバム画面の両方にある)
      document.querySelectorAll("[data-mode]").forEach(function (button) {
        button.addEventListener("click", function () {
          if (button.dataset.mode === "consult") {
            showConsultNote(button.closest(".flow-nav"));
            return;
          }
          document.querySelectorAll(".consult-note").forEach(function (note) { note.remove(); });
          if (!albumScreen.classList.contains("hidden")) {
            if (button.dataset.mode === "album") {
              return;
            }
            leaveAlbum();
          }
          setMode(button.dataset.mode);
        });
      });

      enableHorizontalScroll(document.getElementById("albumYears"), null);

      async function start() {
        // 前回の一覧があれば、LIFFの準備を待たずにすぐ表示する(最新の一覧は裏で取り直す)
        const cached = previewCount === null ? readCache() : null;
        if (cached) {
          locations = cached;
          setStatus("");
          renderCollage();
        }

        if (previewCount !== null) {
          await refreshLocations();
          return;
        }

        if (!BETA_LIFF_ID) {
          setStatus("検証用LIFFアプリのIDが設定されていません。", true);
          return;
        }

        try {
          await liff.init({ liffId: BETA_LIFF_ID, withLoginOnExternalBrowser: true });
        } catch (error) {
          console.error("LIFF初期化エラー", error);
          setStatus("LINEとの接続に失敗しました。LINEアプリから開き直してください。", true);
          return;
        }
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        liffReady = true;
        await refreshLocations();
      }

      start();
    </script>
  </body>
</html>
