<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>そだログ（検証用）</title>
    <!-- ファビコンの画像取得も発生させない -->
    <link rel="icon" href="data:,">
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <!--
      検証用ページ(本番の liff/index.html とは別のLIFFアプリで開く)。
      STEP 4-2b: 場所名だけのタイル(登録順で固定・画像なし)の表示と、場所名だけの登録。
      STEP 4-3b: 場所を選んだあとの記録画面(作業日・写真1枚・作業内容・植物・メモ)と保存。
      アルバムはまだ作らない。
    -->
    <style>
      :root {
        --text: #1f3323;
        --muted: #5d6b5f;
        --accent: #4f7956;
        --bg: #f7faf7;
        --card: #ffffff;
        --line: #cdd8cd;
        --error-bg: #fff0f0;
        --error-text: #8b1f1f;
        --gap: 7px;
        color: var(--text);
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      * { box-sizing: border-box; }

      body { margin: 0; padding: 20px 16px 40px; }

      main { max-width: 520px; margin: 0 auto; }

      .card {
        padding: 22px 16px 20px;
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 4px 16px rgba(0, 0, 0, .06);
      }

      h1 { margin: 0 0 6px; font-size: 22px; text-align: center; }

      #pickerScreen { position: relative; }

      .description { margin: 0 0 18px; color: var(--muted); text-align: center; line-height: 1.6; }

      .hidden { display: none !important; }

      .status { margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; background: #eef6ee; line-height: 1.5; }

      .status.error { color: var(--error-text); background: var(--error-bg); }

      .status button { margin-top: 8px; }

      /* 場所タイル: 「1件(全幅)・2件(50:50)」のグループを登録順に交互に並べる */
      .collage { display: flex; flex-direction: column; gap: var(--gap); }

      .collage-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }

      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 72px;
        padding: 10px 12px;
        border: 0;
        border-radius: 14px;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        line-height: 1.3;
        text-align: center;
        overflow-wrap: anywhere;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .tile:active { filter: brightness(.95); }

      .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

      /* 1件のグループ(全幅) */
      .tile.single { grid-column: 1 / -1; height: 88px; }

      /* 2件のグループ。まだ1件しかない間は一時的に全幅にする(位置は変わらず幅だけ変わる) */
      .tile.pair { height: 104px; }

      .tile.pair.alone { grid-column: 1 / -1; }

      .tile.size-l { font-size: 20px; }

      .tile.size-m { font-size: 18px; }

      .tile.size-s { font-size: 16px; }

      /* アルバム側のタイルだけ、場所名の下に総記録数を小さく出す */
      .tile.with-count { flex-direction: column; gap: 4px; }

      .tile .tile-count { color: rgba(31, 51, 35, .62); font-size: 12px; font-weight: 700; }

      /* 「＋ 場所を追加」は場所タイルと区別した控えめなボタン */
      .add-button {
        display: block;
        width: 100%;
        height: 48px;
        margin-top: 14px;
        border: 2px dashed var(--line);
        border-radius: 14px;
        background: #fff;
        color: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .form { margin-top: 14px; }

      .form label { display: block; margin-bottom: 8px; font-weight: 700; }

      .form input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font: inherit;
        font-size: 16px;
      }

      .form .hint { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

      .form .field-error { margin: 6px 0 0; color: var(--error-text); font-size: 13px; }

      .actions { display: flex; gap: 10px; margin-top: 12px; }

      .actions button, .button {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary { border: 0; background: var(--accent); color: #fff; }

      .primary:disabled { opacity: .6; cursor: wait; }

      .secondary { border: 1px solid var(--accent); background: #fff; color: #3f6546; }

      .note { margin: 0 0 20px; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; }

      /*
       * ---- 記録画面(docs/design/record-screen-board.html の Round 4＋5 を確定版として反映) ----
       * 場所の色(--c-*)は場所ごとに JS で body に設定する(TONES)。ライトモードのみ。
       * 古いiPhoneのLINE内ブラウザでも動くよう :has() は使わず、状態はクラスで切り替える。
       */
      /* 記録画面・アルバム画面を開いている間は、ページ全体を場所色にする */
      body.toned { padding: 0; background: var(--c-bg); }

      .record-screen { color: #26303a; }

      .record-band { padding: 12px 16px; background: var(--c-band); }

      .record-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }

      /* 場所名は2行まで。長さに応じて 21px / 18px / 16px(placeSizeClass) */
      .record-place {
        flex: 1;
        min-width: 0;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        color: var(--c-ink);
        font-size: 21px;
        font-weight: 700;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .record-place.size-m { font-size: 18px; }

      .record-place.size-s { font-size: 16px; }

      /* 「場所を変える」は1行固定 */
      .change-place {
        flex: none;
        padding: 3px 0 6px;
        border: 0;
        background: none;
        color: var(--c-strong);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }

      .change-place:disabled { opacity: .5; }

      .record-note { margin: 4px 0 0; color: #5f6873; font-size: 13px; }

      /* 作業日: 枠全体が1つのボタン(左の日付を押しても、右の「変更」を押しても同じカレンダーが開く) */
      .date-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        margin-top: 8px;
        padding: 6px 6px 6px 14px;
        border: 1px solid var(--c-line);
        border-radius: 12px;
        background: #fff;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .date-box:focus-visible { outline: 3px solid var(--c-strong); outline-offset: 2px; }

      .date-box .date-label { margin-right: 8px; color: #5f6873; font-size: 13px; font-weight: 700; }

      .date-box .date-value { font-size: 16px; font-weight: 700; }

      .date-box .change { flex: none; padding: 9px 16px; border-radius: 9px; background: var(--c-strong); color: #fff; font-size: 14px; font-weight: 700; }

      .date-box:active .change { filter: brightness(.9); }

      .record-body { padding: 12px 16px 0; }

      /* 写真: 空の枠(ボタン)と、写真があるときの表示を別の要素にする */
      .photo-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 0;
        padding-bottom: 75%; /* 4:3(aspect-ratio 非対応の古いブラウザでも同じ比率にする) */
        border-radius: 16px;
        overflow: hidden;
      }

      .photo-stage > .photo-inner { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }

      .photo-empty { border: 1.5px dashed var(--c-line); background: var(--c-frame); color: var(--c-ink); font: inherit; cursor: pointer; }

      .photo-empty:disabled { cursor: wait; }

      .photo-empty .t { font-size: 16px; font-weight: 700; }

      .photo-empty .s { color: #5f6873; font-size: 12px; }

      .photo-filled { background: #eef2ee; }

      .photo-filled img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

      .photo-over { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }

      .photo-over button { padding: 7px 12px; border: 0; border-radius: 999px; background: rgba(38, 48, 58, .72); color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

      .record-label { margin: 14px 0 8px; color: #5f6873; font-size: 12px; font-weight: 700; letter-spacing: .06em; }

      /* 作業内容: 3列×3行で位置を固定 */
      .work-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

      .work-cell {
        height: 50px;
        border: 1px solid var(--c-line);
        border-radius: 12px;
        background: #fff;
        color: #26303a;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .work-cell[aria-pressed="true"] { border-color: var(--c-chip); background: var(--c-chip); color: #fff; font-weight: 700; }

      /* 「植物・メモを書く」(開いたら .open で内側を場所色の淡い面にする) */
      .fold { margin-top: 14px; border: 1px solid var(--c-line); border-radius: 12px; background: #fff; overflow: hidden; }

      .fold.open { background: var(--c-inner); }

      .more-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 13px 14px;
        border: 0;
        background: none;
        color: #26303a;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      .more-toggle .meta { color: var(--c-strong); font-size: 13px; font-weight: 700; }

      .more { padding: 0 14px 12px; }

      .more .record-label:first-child { margin-top: 2px; }

      .tag-field { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--c-line); border-radius: 10px; background: #fff; }

      .tag-field.focused { outline: 2px solid var(--c-strong); outline-offset: -1px; }

      .tag-field input { flex: 1; min-width: 120px; padding: 6px 4px; border: 0; background: none; color: inherit; font: inherit; font-size: 16px; outline: none; }

      .tag-field .add { padding: 6px 12px; border: 0; border-radius: 8px; background: var(--c-frame); color: var(--c-strong); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

      .tags { display: contents; }

      .tag { display: inline-flex; align-items: center; padding: 4px 2px 4px 12px; border-radius: 999px; background: var(--c-band); color: var(--c-ink); font-size: 15px; }

      .tag button { width: 30px; height: 30px; border: 0; background: none; color: #5f6873; font-size: 17px; cursor: pointer; }

      .memo {
        display: block;
        width: 100%;
        min-height: 84px;
        padding: 11px 12px;
        border: 1px solid var(--c-line);
        border-radius: 10px;
        background: #fff;
        color: inherit;
        font: inherit;
        font-size: 16px;
        line-height: 1.5;
        resize: none;
      }

      .memo:focus { outline: 2px solid var(--c-strong); outline-offset: -1px; }

      .field-error { margin: 6px 0 0; color: var(--error-text); font-size: 13px; }

      .counter { margin: 4px 0 0; color: #5f6873; font-size: 12px; text-align: right; }

      .counter.over { color: var(--error-text); }

      /* 保存欄: 画面下に固定。左に入力内容の要約、右に保存ボタン(場所色で最も濃い色＋白文字) */
      .savebar {
        position: -webkit-sticky;
        position: sticky;
        bottom: 0;
        z-index: 2;
        margin-top: 16px;
        padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--c-line);
        background: #fff;
      }

      .save-row { display: flex; align-items: center; gap: 12px; }

      .summary { flex: 1; min-width: 0; color: #5f6873; font-size: 13px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .summary b { color: #26303a; }

      .save {
        flex: none;
        width: 132px;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--c-strong);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .save:disabled { background: var(--c-disabled); cursor: default; }

      .save.saving { background: var(--c-strong); opacity: .7; cursor: wait; }

      .save-error { margin: 0 0 8px; padding: 9px 12px; border-radius: 10px; background: var(--error-bg); color: var(--error-text); font-size: 13px; line-height: 1.5; }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        width: max-content;
        max-width: calc(100% - 32px);
        padding: 12px 18px;
        border-radius: 12px;
        background: #2d4a33;
        color: #fff;
        font-weight: 700;
        text-align: center;
        transform: translateX(-50%);
        box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
      }

      /* ---- 作業日のカレンダー(画面の下から出るシート) ---- */
      html.sheet-open, html.sheet-open body { overflow: hidden; }

      .cal-overlay {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: rgba(20, 28, 40, .4);
        color: #26303a;
      }

      .cal-sheet {
        width: 100%;
        max-width: 520px;
        max-height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
        border-radius: 20px 20px 0 0;
        background: #fff;
      }

      .cal-top { display: flex; align-items: center; justify-content: space-between; }

      .cal-title { margin: 0; font-size: 17px; font-weight: 700; }

      .cal-close { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: #f0f2f5; color: #3a4450; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

      .cal-close span { font-size: 18px; line-height: 1; }

      .cal-picked { margin: 8px 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--c-frame); color: #5f6873; font-size: 14px; }

      .cal-picked b { margin-left: 6px; color: var(--c-ink); font-size: 20px; }

      .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }

      .cal-nav .month { font-size: 18px; font-weight: 700; }

      .cal-nav button { width: 44px; height: 44px; border: 1px solid var(--c-line); border-radius: 12px; background: #fff; color: var(--c-strong); font: inherit; font-size: 20px; font-weight: 700; cursor: pointer; }

      .cal-nav button:disabled { border-color: #eceff2; color: #c5cad1; cursor: default; }

      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

      .cal-week { padding: 4px 0; color: #6b7480; font-size: 12px; font-weight: 700; text-align: center; }

      .cal-week.sun, .cal-day.sun { color: #b0464a; }

      .cal-week.sat, .cal-day.sat { color: #3c5ea3; }

      .cal-day {
        position: relative;
        height: 0;
        padding-bottom: 100%; /* 正方形 */
        border: 0;
        border-radius: 12px;
        background: none;
        color: #26303a;
        font: inherit;
        font-size: 17px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .cal-day > span { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

      .cal-day:not(:disabled):active { background: var(--c-frame); }

      /* 今日: 枠線と「今日」の小さな文字 */
      .cal-day.today { box-shadow: inset 0 0 0 2px var(--c-chip); font-weight: 700; }

      .cal-day .today-mark { font-size: 10px; font-weight: 700; line-height: 1; color: var(--c-chip); }

      /* 選んでいる日: 場所色で最も濃い色で塗りつぶし */
      .cal-day.selected { background: var(--c-strong); color: #fff; font-weight: 700; box-shadow: none; }

      .cal-day.selected .today-mark { color: #fff; }

      /* 未来の日は選べない */
      .cal-day:disabled { color: #c5cad1; cursor: default; }

      .cal-legend { display: flex; gap: 14px; margin: 8px 2px 0; color: #6b7480; font-size: 12px; }

      .cal-legend i { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border-radius: 4px; vertical-align: -1px; }

      .cal-legend .l-today { box-shadow: inset 0 0 0 2px var(--c-chip); }

      .cal-legend .l-selected { background: var(--c-strong); }

      .cal-today-link { margin-top: 10px; padding: 6px 0; border: 0; background: none; color: var(--c-strong); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

      .cal-actions { display: flex; gap: 10px; margin-top: 14px; }

      .cal-actions button { flex: 1; height: 50px; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }

      .cal-actions .cancel { border: 1px solid #cfd5dc; background: #fff; color: #3a4450; }

      .cal-actions .ok { border: 0; background: var(--c-strong); color: #fff; }

      /*
       * ---- 3機能のナビゲーション(docs/design/navigation-board.html Round 3 を確定版として反映) ----
       * 左から「アルバム → 記録する → 相談」を丸アイコンと線でつなぐ(考え方は 過去 → 今 → 次。文字では出さない)。
       * 選択中だけ色つき＋緑の太い輪、ほかは少し色を落とす。相談は準備中(白黒・点線の輪)で、押すと案内だけを出す。
       * アイコンは icons/ の正方形・背景透過PNG(128px)。色はリッチメニューの緑にそろえる。
       */
      .flow-nav { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 0 0 14px; }

      /* 丸の中心どうしをつなぐ線(相談へは点線＝まだ先の機能) */
      .flow-nav::before,
      .flow-nav::after { content: ""; position: absolute; top: 31px; width: 33.3%; }

      .flow-nav::before { left: 16.7%; height: 2px; background: #d7dbe0; }

      .flow-nav::after { left: 50%; height: 0; border-top: 2px dashed #d7dbe0; }

      .flow-nav button {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 64px;
        padding: 1px 2px;
        border: 0;
        background: none;
        color: #5f6873;
        font: inherit;
        line-height: 1.25;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .flow-icon {
        display: block;
        width: 60px;
        height: 60px;
        border: 2px solid #d7dbe0;
        border-radius: 50%;
        background: #fff;
        overflow: hidden;
        -webkit-filter: saturate(.55) opacity(.8);
        filter: saturate(.55) opacity(.8);
      }

      .flow-icon img { display: block; width: 100%; height: 100%; }

      .flow-name { margin-top: 3px; font-size: 13px; font-weight: 700; }

      .flow-nav button[aria-pressed="true"] { color: #3f6b45; }

      .flow-nav button[aria-pressed="true"] .flow-icon { border: 3px solid #3f6b45; box-shadow: 0 0 0 3px #e6efe5; -webkit-filter: none; filter: none; }

      .flow-nav button[aria-pressed="true"] .flow-name { font-weight: 800; }

      .flow-nav button.coming { color: #9aa2ab; }

      .flow-nav button.coming .flow-icon { border-style: dashed; -webkit-filter: grayscale(1) opacity(.5); filter: grayscale(1) opacity(.5); }

      /* 「準備中」は丸の下の縁に重ねて、ナビゲーションの高さを増やさない */
      .flow-soon { position: absolute; top: 48px; left: 50%; padding: 1px 6px; border: 1px solid #fff; border-radius: 999px; background: #eef0f3; color: #5f6873; font-size: 10px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); }

      /* 相談を押したときの案内(画面は変えない) */
      .consult-note { position: absolute; left: 16px; right: 16px; z-index: 30; padding: 12px 14px; border: 1px solid #d7dbe0; border-radius: 14px; background: #fff; box-shadow: 0 8px 24px rgba(20, 28, 40, .16); color: #26303a; font-size: 14px; line-height: 1.6; text-align: left; }

      .consult-note b { display: block; margin-bottom: 2px; }

      .consult-note button { display: block; margin: 8px 0 0 auto; padding: 6px 12px; border: 0; border-radius: 8px; background: #eef0f3; color: #26303a; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

      /*
       * ---- アルバム画面(docs/design/album-screen-board.html の Round 3 を確定版として反映) ----
       * 場所ごとに振り返る。場所色の帯に場所名・件数・年ボタン、写真は正方形タイルを横に並べ(左が過去・右が最新)、
       * 写真なしの記録は表にする。:has()・inset・aspect-ratio は使わない。
       */
      .album-screen { position: relative; padding: 10px 0 calc(28px + env(safe-area-inset-bottom, 0px)); color: #26303a; }

      .album-screen .flow-nav { margin: 0 16px; }

      .album-band { margin-top: 12px; padding: 12px 16px 0; background: var(--c-band); }

      .album-place-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

      .album-place {
        flex: 1;
        min-width: 0;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        color: var(--c-ink);
        font-size: 19px;
        font-weight: 700;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .album-place .count { margin-left: 8px; color: #5f6873; font-size: 14px; white-space: nowrap; }

      /* 横スクロールする並び(年ボタン・写真・表)。指とトラックパッドはブラウザ標準、マウスは JS で送る */
      .h-scroll {
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: var(--c-line) transparent;
      }

      .h-scroll::-webkit-scrollbar { height: 6px; }

      .h-scroll::-webkit-scrollbar-thumb { border-radius: 3px; background: var(--c-line); }

      .album-years { display: flex; gap: 8px; margin: 10px -16px 0; padding: 0 16px 12px; scrollbar-width: none; }

      .album-years::-webkit-scrollbar { display: none; }

      .album-years button { flex: none; min-width: 72px; height: 38px; padding: 0 14px; border: 1px solid var(--c-line); border-radius: 999px; background: #fff; color: #26303a; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }

      .album-years button small { margin-left: 4px; color: #5f6873; font-size: 11px; }

      .album-years button[aria-pressed="true"] { border-color: var(--c-strong); background: var(--c-strong); color: #fff; }

      .album-years button[aria-pressed="true"] small { color: rgba(255, 255, 255, .8); }

      .album-status { margin: 16px; padding: 12px; border-radius: 12px; background: var(--c-frame); color: var(--c-ink); font-size: 14px; line-height: 1.6; }

      .album-status.error { background: var(--error-bg); color: var(--error-text); }

      .album-status button { display: block; margin-top: 8px; padding: 8px 14px; border: 1px solid currentColor; border-radius: 10px; background: #fff; color: inherit; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

      .section-label { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 16px 8px; color: #5f6873; font-size: 12px; font-weight: 700; letter-spacing: .06em; }

      .section-label small { font-weight: 400; letter-spacing: 0; }

      .truncated-note { margin: 0 16px 8px; padding: 8px 10px; border-radius: 10px; background: var(--c-frame); color: var(--c-ink); font-size: 12px; line-height: 1.5; }

      .album-empty { margin: 0 16px; padding: 18px 12px; border: 1.5px dashed var(--c-line); border-radius: 12px; color: #5f6873; font-size: 13px; text-align: center; }

      /* 写真の横並び: 正方形タイル、幅は画面幅の62%(最大322px) */
      .strip-wrap { position: relative; }

      .strip { display: flex; gap: 10px; padding: 0 16px 10px; cursor: grab; -webkit-user-select: none; user-select: none; }

      .strip.dragging { cursor: grabbing; }

      .strip.dragging .ph { pointer-events: none; }

      .strip-wrap::before,
      .strip-wrap::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 10px;
        z-index: 1;
        width: 28px;
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s;
      }

      .strip-wrap::before { left: 0; background: linear-gradient(90deg, var(--c-bg), rgba(255, 255, 255, 0)); }

      .strip-wrap::after { right: 0; background: linear-gradient(270deg, var(--c-bg), rgba(255, 255, 255, 0)); }

      .strip-wrap.more-left::before, .strip-wrap.more-right::after { opacity: 1; }

      .ph {
        position: relative;
        flex: none;
        width: 62vw;
        max-width: 322px;
        height: 62vw;
        max-height: 322px;
        padding: 0;
        border: 0;
        border-radius: 14px;
        background: var(--c-frame); /* 読み込むまでは淡い場所色の枠 */
        overflow: hidden;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .ph img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; -webkit-user-drag: none; }

      .ph img.loaded { opacity: 1; }

      .ph .date { position: absolute; left: 8px; top: 8px; padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: #26303a; font-size: 12px; font-weight: 700; }

      .ph .info { position: absolute; right: 8px; bottom: 8px; display: flex; width: 30px; height: 30px; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255, 255, 255, .92); color: var(--c-strong); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }

      .ph .failed { position: absolute; top: 50%; left: 0; right: 0; color: #5f6873; font-size: 12px; text-align: center; transform: translateY(-50%); }

      .scroll-hint { margin: 2px 16px 0; color: #5f6873; font-size: 11px; }

      /* 写真なしの記録の表(新しい順、作業日の列を左端に固定) */
      .album-table-wrap { margin: 0 16px; border: 1px solid var(--c-line); border-radius: 12px; background: #fff; }

      .album-table-wrap table { min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }

      .album-table-wrap th, .album-table-wrap td { padding: 9px 10px; border-bottom: 1px solid var(--c-line); text-align: left; vertical-align: top; }

      .album-table-wrap tr:last-child td { border-bottom: 0; }

      .album-table-wrap th { background: var(--c-band); color: var(--c-ink); font-size: 12px; white-space: nowrap; }

      .album-table-wrap .date-col { position: -webkit-sticky; position: sticky; left: 0; z-index: 1; background: #fff; font-weight: 700; white-space: nowrap; box-shadow: 1px 0 0 var(--c-line); }

      .album-table-wrap th.date-col { z-index: 2; background: var(--c-band); }

      .album-table-wrap .works div { white-space: nowrap; }

      .album-table-wrap .tags-col { min-width: 110px; }

      .album-table-wrap .memo-col { min-width: 200px; max-width: 240px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

      .album-table-wrap .none, .detail-list .none { color: #b0b6bd; }

      /* 記録の詳細(画面の下から出るシート。作業日のカレンダーと同じ作り) */
      .detail-overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 28, 40, .45); color: #26303a; }

      .detail-sheet { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0; background: #fff; }

      .detail-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

      .detail-top b { font-size: 17px; }

      .detail-photo { position: relative; min-height: 200px; border-radius: 14px; background: var(--c-frame); overflow: hidden; }

      .detail-photo img { display: block; width: 100%; max-height: 60vh; object-fit: contain; }

      .detail-photo .hq { position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 999px; background: rgba(38, 48, 58, .7); color: #fff; font-size: 11px; font-weight: 700; }

      .detail-list { margin: 12px 0 0; }

      .detail-list > div { display: flex; gap: 8px; padding: 9px 2px; border-bottom: 1px solid #edf0f3; font-size: 15px; line-height: 1.5; }

      .detail-list > div:last-child { border-bottom: 0; }

      .detail-list dt { flex: none; width: 76px; color: #5f6873; font-size: 13px; font-weight: 700; }

      .detail-list dd { flex: 1; min-width: 0; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <section id="pickerScreen" class="card">
        <nav class="flow-nav" aria-label="機能の切り替え">
          <button type="button" data-mode="album" aria-pressed="false" aria-label="アルバム">
            <span class="flow-icon"><img src="icons/nav-album.png" width="60" height="60" alt=""></span>
            <span class="flow-name">アルバム</span>
          </button>
          <button type="button" data-mode="record" aria-pressed="true" aria-label="記録する">
            <span class="flow-icon"><img src="icons/nav-record.png" width="60" height="60" alt=""></span>
            <span class="flow-name">記録する</span>
          </button>
          <button type="button" data-mode="consult" class="coming" aria-pressed="false" aria-label="相談（準備中）">
            <span class="flow-icon"><img src="icons/nav-consult.png" width="60" height="60" alt=""></span>
            <span class="flow-name">相談</span>
            <span class="flow-soon">準備中</span>
          </button>
        </nav>
        <h1 id="pickerTitle">場所を選ぶ</h1>
        <p id="pickerDescription" class="description">記録する場所を選んでください</p>
        <p id="pickerNote" class="status hidden">まだ場所がありません。「記録する」から場所を登録してください。</p>
        <p id="status" class="status">読み込み中です。</p>

        <div id="collage" class="collage" aria-label="場所の一覧"></div>

        <button id="addButton" class="add-button hidden" type="button">＋ 場所を追加</button>

        <form id="addForm" class="form hidden" novalidate>
          <label id="addLabel" for="nameInput">場所の名前</label>
          <input id="nameInput" type="text" autocomplete="off" placeholder="例：北側の花壇、ベランダ">
          <p class="hint">20文字まで。写真や方角は不要です。</p>
          <p id="nameError" class="field-error hidden"></p>
          <div class="actions">
            <button id="cancelAdd" class="secondary" type="button">やめる</button>
            <button id="submitAdd" class="primary" type="submit">登録する</button>
          </div>
        </form>
      </section>

      <section id="recordScreen" class="record-screen hidden">
        <div class="record-band">
          <div class="record-top">
            <div id="recordPlace" class="record-place"></div>
            <button id="changePlace" class="change-place" type="button">場所を変える</button>
          </div>
          <p id="recordNote" class="record-note hidden"></p>
          <button id="workDateButton" class="date-box" type="button">
            <span><span class="date-label">作業日</span><span id="workDateText" class="date-value"></span></span>
            <span class="change">変更</span>
          </button>
        </div>

        <div class="record-body">
          <button id="photoButton" class="photo-stage photo-empty" type="button">
            <span class="photo-inner">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
              <span id="photoButtonText" class="t">写真を撮る・選ぶ</span>
              <span class="s">1枚まで・なくても保存できます</span>
            </span>
          </button>
          <div id="photoPreview" class="photo-stage photo-filled hidden">
            <img id="photoImage" alt="選んだ写真">
            <div class="photo-over">
              <button id="photoChange" type="button">変える</button>
              <button id="photoRemove" type="button">外す</button>
            </div>
          </div>
          <input id="photoInput" type="file" accept="image/*" class="hidden">
          <p id="photoStatus" class="field-error hidden"></p>

          <div class="record-label">作業内容</div>
          <div id="workChips" class="work-grid"></div>

          <div id="fold" class="fold">
            <button id="moreToggle" class="more-toggle" type="button" aria-expanded="false" aria-controls="moreArea">
              <span>植物・メモを書く</span>
              <span id="moreMeta" class="meta">＋</span>
            </button>
            <div id="moreArea" class="more hidden">
              <div class="record-label">植物 <span style="font-weight: 400">（10個まで）</span></div>
              <div id="tagField" class="tag-field">
                <span id="tags" class="tags"></span>
                <input id="tagInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="例：アジサイ" aria-label="植物の名前">
                <button id="tagAdd" class="add" type="button">追加</button>

              <p id="tagError" class="field-error hidden"></p>
              <div class="record-label">メモ</div>
              <textarea id="memoInput" class="memo" placeholder="気づいたことなど" aria-label="メモ"></textarea>
              <p id="memoCounter" class="counter">0 / 300</p>
            </div>

        <div class="savebar">
          <p id="saveError" class="save-error hidden"></p>
          <div class="save-row">
            <div id="saveSummary" class="summary"></div>
            <button id="saveButton" class="save" type="button">保存する</button>
          </div>
        </div>
      </section>

      <section id="albumScreen" class="album-screen hidden">
        <nav class="flow-nav" aria-label="機能の切り替え">
          <button type="button" data-mode="album" aria-pressed="true" aria-label="アルバム">
            <span class="flow-icon"><img src="icons/nav-album.png" width="60" height="60" alt=""></span>
            <span class="flow-name">アルバム</span>
          </button>
          <button type="button" data-mode="record" aria-pressed="false" aria-label="記録する">
            <span class="flow-icon"><img src="icons/nav-record.png" width="60" height="60" alt=""></span>
            <span class="flow-name">記録する</span>
          </button>
          <button type="button" data-mode="consult" class="coming" aria-pressed="false" aria-label="相談（準備中）">
            <span class="flow-icon"><img src="icons/nav-consult.png" width="60" height="60" alt=""></span>
            <span class="flow-name">相談</span>
            <span class="flow-soon">準備中</span>
          </button>
        </nav>
        <div class="album-band">
          <div class="album-place-row">
            <div id="albumPlace" class="album-place"></div>
            <button id="albumChangePlace" class="change-place" type="button">場所を変える</button>
          </div>
          <div id="albumYears" class="album-years h-scroll" role="group" aria-label="年"></div>
        </div>
        <div id="albumBody"></div>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>

    <script>
      // 検証用LIFFアプリのID(本番LIFFとは別アプリ。エンドポイント: /sodalog/beta/)
      const BETA_LIFF_ID = "2010871516-iHZTvGWU";
      const API_BASE = "https://sodalog-server-484567695262.asia-northeast1.run.app";
      const CACHE_KEY = "sodalog.beta.locations.v1";
      const NAME_MAX_LENGTH = 20;

      // 記録の入力(サーバーと同じ規則。docs/sodalog-spec.md 3.1節・6章・12.9節)
      const WORK_TYPES = ["水やり", "草取り", "肥料", "剪定", "植え付け", "植え替え", "成長記録", "収穫", "撤去"];
      const TAG_MAX_LENGTH = 20;
      const TAG_MAX_COUNT = 10;
      const MEMO_MAX_LENGTH = 300;
      // 写真: 長辺1600pxに縮小してJPEG品質0.8。3MBを超える場合だけ0.7、0.6と下げて圧縮し直す
      const PHOTO_MAX_EDGE = 1600;
      const PHOTO_QUALITIES = [0.8, 0.7, 0.6];
      const PHOTO_MAX_BYTES = 3 * 1024 * 1024;

      // 場所IDから決める淡い色(文字色 #1f3323 とのコントラストを十分に取れる明るさ)
      const PALETTE = [
        "#e3ecd6", // 若葉
        "#f7dfdd", // 桜
        "#dde3f5", // 空
        "#f1e6d4", // 砂
        "#d8ece8", // 水
        "#ece0f0", // 藤
        "#f5ecc8", // 菜の花
        "#e0e8e0", // 苔
      ];

      /*
       * 記録画面用の場所色の濃淡(PALETTE と同じ順。docs/design/record-screen-board.html Round 5)。
       * 元の色の色相のまま明るさだけを変えたもの。白文字を載せる chip・strong は白とのコントラスト比
       * 4.8・7.0 以上、ink は band 上で 8.5 以上。
       *   bg: 画面の地 / band: 場所帯 / frame: 写真枠 / inner: 折りたたみの内側 / line: 枠線
       *   disabled: 押せない保存ボタン / chip: 選択中の作業 / strong: 保存・変更(最も濃い) / ink: 場所名など
       */
      const TONES = [
        { bg: "#fbfdfa", band: "#f0f5e8", frame: "#f4f8ef", inner: "#f7f9f3", line: "#dce4d1", disabled: "#c4ccb8", chip: "#5f7a39", strong: "#495e2c", ink: "#3a4b23" }, // 若葉
        { bg: "#fef9f9", band: "#f9e6e4", frame: "#fbeeec", inner: "#fcf1f1", line: "#eaccca", disabled: "#d3b3b1", chip: "#b6544c", strong: "#923e37", ink: "#6b2e29" }, // 桜
        { bg: "#f9fafd", band: "#e5eaf7", frame: "#edf0fa", inner: "#f1f4fb", line: "#ccd3e8", disabled: "#b3bad1", chip: "#556eb9", strong: "#3c559f", ink: "#2c3e74" }, // 空
        { bg: "#fdfcf9", band: "#f7f0e6", frame: "#f9f5ee", inner: "#fbf7f2", line: "#e7ddcd", disabled: "#d0c5b4", chip: "#8b6c39", strong: "#6d5329", ink: "#554120" }, // 砂
        { bg: "#fafcfc", band: "#e9f4f2", frame: "#f0f7f6", inner: "#f3f9f8", line: "#d1e3df", disabled: "#b8cbc7", chip: "#3d7d70", strong: "#2f6056", ink: "#254b44" }, // 水
        { bg: "#fcfafd", band: "#f1e9f4", frame: "#f6f0f8", inner: "#f8f3f9", line: "#dfd1e3", disabled: "#c7b8cb", chip: "#9958ae", strong: "#79438b", ink: "#583165" }, // 藤
        { bg: "#fefdf9", band: "#faf5e3", frame: "#fbf8ec", inner: "#fcfaf0", line: "#ece5c8", disabled: "#d5cdaf", chip: "#817135", strong: "#645726", ink: "#4f461e" }, // 菜の花
        { bg: "#fafcfa", band: "#eaf3ea", frame: "#f1f6f1", inner: "#f4f8f4", line: "#d4e0d4", disabled: "#bbc9bb", chip: "#4b7c4b", strong: "#3a613a", ink: "#2d4b2d" }, // 苔
      ];
      const TONE_VARS = ["bg", "band", "frame", "inner", "line", "disabled", "chip", "strong", "ink"];

      /*
       * PCのブラウザで見た目だけ確かめるためのプレビュー。
       * localhost で ?preview=数字 を付けたときだけ、LIFFとAPIを使わずに仮の場所で表示する。
       */
      const params = new URLSearchParams(window.location.search);
      const isLocalHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
      const previewCount = isLocalHost && params.has("preview") ? Number(params.get("preview")) || 0 : null;

      const statusEl = document.getElementById("status");
      const collageEl = document.getElementById("collage");
      const addButton = document.getElementById("addButton");
      const addForm = document.getElementById("addForm");
      const nameInput = document.getElementById("nameInput");
      const nameError = document.getElementById("nameError");
      const submitAdd = document.getElementById("submitAdd");
      const pickerScreen = document.getElementById("pickerScreen");
      const recordScreen = document.getElementById("recordScreen");
      const photoInput = document.getElementById("photoInput");
      const tagInput = document.getElementById("tagInput");
      const tagError = document.getElementById("tagError");
      const memoInput = document.getElementById("memoInput");
      const saveButton = document.getElementById("saveButton");
      const saveError = document.getElementById("saveError");

      let locations = [];
      let liffReady = false;

      function setStatus(message, isError, retry) {
        statusEl.replaceChildren();
        if (!message) {
          statusEl.classList.add("hidden");
          return;
        }
        statusEl.classList.remove("hidden");
        statusEl.classList.toggle("error", Boolean(isError));
        statusEl.append(document.createTextNode(message));
        if (retry) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "button secondary";
          button.textContent = "再読み込み";
          button.addEventListener("click", retry);
          statusEl.append(document.createElement("br"), button);
        }
      }

      // 場所ID(文字列)から、いつも同じパレットの番号を返す(FNV-1a)
      function paletteIndex(id) {
        let hash = 0x811c9dc5;
        for (let i = 0; i < id.length; i++) {
          hash ^= id.charCodeAt(i);
          hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        return hash % PALETTE.length;
      }

      function colorFor(id) {
        return PALETTE[paletteIndex(id)];
      }

      // 記録画面の場所色(タイルと同じ色の濃淡)
      function toneFor(id) {
        return TONES[paletteIndex(id)];
      }

      function sizeClass(name) {
        const length = Array.from(name).length;
        return length <= 6 ? "size-l" : length <= 12 ? "size-m" : "size-s";
      }

      /*
       * 登録順のまま「1件・2件・1件・2件……」のグループに分ける。
       * 追加で変わるのは最後のグループだけなので、既存の場所の位置は変わらない。
       */
      function groupLocations(list) {
        const groups = [];
        let index = 0;
        while (index < list.length) {
          const size = groups.length % 2 === 0 ? 1 : 2;
          groups.push({ size: size, items: list.slice(index, index + size) });
          index += size;
        }
        return groups;
      }

      function renderCollage() {
        collageEl.replaceChildren();

        groupLocations(locations).forEach(function (group) {
          const row = document.createElement("div");
          row.className = "collage-row";

          group.items.forEach(function (location) {
            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile " + sizeClass(location.name);
            if (group.size === 1) {
              tile.classList.add("single");
            } else {
              tile.classList.add("pair");
              if (group.items.length === 1) {
                tile.classList.add("alone");
              }
            }
            tile.style.background = colorFor(location.id);
            tile.textContent = location.name;
            // 総記録数はアルバム側だけ(記録する側では出さない)
            if (mode === "album" && locationCounts && locationCounts[location.id] !== undefined) {
              tile.classList.add("with-count");
              tile.append(el("span", "tile-count", locationCounts[location.id] + "件"));
            }
            tile.addEventListener("click", function () {
              if (mode === "album") {
                openAlbum(location);
              } else {
                openRecord(location, "");
              }
            });
            row.append(tile);
          });

          collageEl.append(row);
        });

        const isEmpty = locations.length === 0;
        // 場所の登録は「記録する」側だけ。アルバム側で場所がなければ、そのことを知らせる
        addButton.classList.toggle("hidden", isEmpty || mode === "album" || !addForm.classList.contains("hidden"));
        document.getElementById("pickerNote").classList.toggle("hidden", !(isEmpty && mode === "album"));
        if (isEmpty && mode === "record") {
          openAddForm(true);
        }
      }

      // 「記録する / アルバム」の切り替え(場所を選ぶ画面の見出しと、タイルを押したときの行き先が変わる)
      let mode = "record";

      function setMode(next) {
        mode = next;
        document.querySelectorAll("[data-mode]").forEach(function (button) {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        });
        // 機能名はナビゲーションに出ているので、見出しはどちらも「場所を選ぶ」
        document.getElementById("pickerTitle").textContent = "場所を選ぶ";
        document.getElementById("pickerDescription").textContent =
          mode === "album" ? "振り返る場所を選んでください" : "記録する場所を選んでください";
        if (mode === "album") {
          addForm.classList.add("hidden");
          nameInput.value = "";
          nameError.classList.add("hidden");
          loadLocationCounts();
        }
        renderCollage();
      }

      /*
       * アルバム側の場所タイルに出す総記録数。場所ごとに /api/album を呼ばず、
       * 場所一覧API を ?include=counts で1回呼んで、全部の場所の件数をまとめて受け取る。
       * 記録を保存したら取り直す(invalidateAlbum)。取れなくても、件数なしでタイルは使える。
       */
      let locationCounts = null;
      let countsRequest = 0;

      async function loadLocationCounts() {
        if (locationCounts || (!liffReady && previewCount === null)) {
          return;
        }
        const requestId = ++countsRequest;
        try {
          const data = await api("GET", "/api/locations?include=counts");
          if (requestId !== countsRequest) {
            return;
          }
          locationCounts = {};
          (data.locations || []).forEach(function (location) {
            locationCounts[location.id] = location.recordCount;
          });
          // 件数と一緒に届いた最新の場所一覧も反映する
          setLocations((data.locations || []).map(function (location) {
            return { id: location.id, name: location.name, createdAt: location.createdAt };
          }));
        } catch (error) {
          console.error("記録数の取得エラー", error);
        }
      }

      function openAddForm(isFirst) {
        document.getElementById("addLabel").textContent = isFirst
          ? "最初の場所を登録しましょう"
          : "場所の名前";
        document.getElementById("cancelAdd").classList.toggle("hidden", isFirst);
        addForm.classList.remove("hidden");
        addButton.classList.add("hidden");
        nameError.classList.add("hidden");
      }

      function closeAddForm() {
        addForm.classList.add("hidden");
        nameInput.value = "";
        nameError.classList.add("hidden");
        addButton.classList.toggle("hidden", locations.length === 0);
      }

      function showPicker() {
        recordScreen.classList.add("hidden");
        document.getElementById("albumScreen").classList.add("hidden");
        document.body.classList.remove("toned");
        pickerScreen.classList.remove("hidden");
        window.scrollTo({ top: 0 });
      }

      let toastTimer = null;

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.remove("hidden");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.add("hidden");
        }, 2500);
      }

      function readCache() {
        try {
          const cached = JSON.parse(window.localStorage.getItem(CACHE_KEY) || "null");
          return Array.isArray(cached) ? cached : null;
        } catch (error) {
          return null;
        }
      }

      function writeCache(list) {
        // プレビューの仮データで本物のキャッシュを上書きしない
        if (previewCount !== null) {
          return;
        }
        try {
          window.localStorage.setItem(CACHE_KEY, JSON.stringify(list));
        } catch (error) {
          // 保存できなくても表示には影響しない
        }
      }

      function setLocations(list) {
        locations = list;
        writeCache(list);
        renderCollage();
      }

      // サーバーと同じ規則(NFKC・前後の空白除去・20文字まで)で先に確かめる
      function normalizeName(value) {
        const name = String(value || "").normalize("NFKC").trim();
        if (!name) {
          return { ok: false, message: "場所の名前を入力してください。" };
        }
        if (/[\u0000-\u001f\u007f]/.test(name)) {
          return { ok: false, message: "使えない文字が含まれています。" };
        }
        if (Array.from(name).length > NAME_MAX_LENGTH) {
          return { ok: false, message: "20文字以内で入力してください。" };
        }
        return { ok: true, name: name };
      }

      class ApiError extends Error {
        constructor(status, code) {
          super(code || "api_error");
          this.status = status;
          this.code = code;
        }
      }

      function messageFor(error) {
        if (error instanceof ApiError) {
          if (error.status === 401) {
            return "LINEの認証が切れました。LINEから開き直してください。";
          }
          if (error.status === 403) {
            return "このアカウントでは利用できません。";
          }
          if (error.code === "storage_not_initialized") {
            return "保存先が準備されていません。";
          }
        }
        return "場所を読み込めませんでした。通信状況を確認してください。";
      }

      async function callApi(method, path, body) {
        const response = await fetch(API_BASE + path, {
          method: method,
          headers: Object.assign(
            { Authorization: "Bearer " + liff.getIDToken() },
            body ? { "Content-Type": "application/json" } : {},
          ),
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await response.json().catch(function () {
          return {};
        });
        if (!response.ok) {
          throw new ApiError(response.status, data.error);
        }
        return data;
      }

      // ---- プレビュー用の仮API(localhost のみ) ----
      const previewNames = [
        "北側の花壇", "南側の花壇", "玄関", "室内", "ベランダ",
        "東側フェンス沿いのプランター", "家庭菜園", "駐車場横", "物置の前", "西側",
      ];
      let previewStore = previewNames.slice(0, Math.max(0, previewCount || 0)).map(function (name, i) {
        return { id: "loc_preview" + String(i).padStart(2, "0"), name: name, createdAt: "" };
      });

      // ?failsave=1 を付けると、最初の保存だけ失敗させて「もう一度保存」を確かめられる
      let previewSaveFailed = false;

      async function previewApi(method, path, body) {
        if (path === "/api/records") {
          await new Promise(function (resolve) { setTimeout(resolve, 1500); });
          if (params.has("failsave") && !previewSaveFailed) {
            previewSaveFailed = true;
            throw new ApiError(0, "preview_failure");
          }
          const logged = Object.assign({}, body);
          if (body.photo) {
            logged.photo = "(base64 " + body.photo.data.length + "文字)";
          }
          console.log("プレビュー: 保存する内容", JSON.stringify(logged));
          previewSaved.push(Object.assign({}, body, {
            recordedAt: new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 19) + "+09:00",
            photoFileId: body.photo ? "prevsaved_" + body.recordId : null,
            photoData: body.photo ? "data:image/jpeg;base64," + body.photo.data : null,
          }));
          return { created: true, record: body };
        }
        if (path.indexOf("/api/album") === 0) {
          await new Promise(function (resolve) { setTimeout(resolve, 400); });
          const query = new URLSearchParams(path.split("?")[1]);
          return previewAlbum(query.get("locationId"), query.get("year"));
        }
        if (method === "GET" && path.indexOf("include=counts") !== -1) {
          await new Promise(function (resolve) { setTimeout(resolve, 300); });
          return {
            locations: previewStore.map(function (location) {
              return Object.assign({}, location, { recordCount: previewRecordsFor(location.id).length });
            }),
          };
        }
        if (method === "GET") {
          return { locations: previewStore.slice() };
        }
        const existing = previewStore.find(function (l) { return l.name === body.name; });
        if (existing) {
          return { location: existing, created: false };
        }
        const location = { id: "loc_preview" + Date.now(), name: body.name, createdAt: "" };
        previewStore.push(location);
        return { location: location, created: true };
      }

      // プレビュー: 場所ごとの見本の記録(決まった乱数で毎回同じ)と、このページで保存した記録
      const previewSaved = [];
      const previewRecordCache = {};

      function previewRecordsFor(locationId) {
        if (!previewRecordCache[locationId]) {
          const index = previewStore.findIndex(function (l) { return l.id === locationId; });
          let seed = 11 + index * 7;
          const rand = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
          const plants = ["アジサイ", "ホスタ", "バラ", "ミニトマト", "ラベンダー"];
          const memos = ["", "", "つぼみが増えてきた。", "下の葉が少し黄色い。\n水やりの間隔を見直す。", "花がら摘み。", ""];
          // 3件目の場所(玄関)は記録なし、それ以外は年ごとに数件ずつ
          const plan = index === 2 ? {} : index % 2 === 0 ? { 2024: 5, 2025: 12, 2026: 10 } : { 2026: 4 };
          const list = [];
          Object.keys(plan).forEach(function (year) {
            for (let i = 0; i < plan[year]; i++) {
              const month = 1 + Math.floor(rand() * (year === "2026" ? 9 : 12));
              const works = WORK_TYPES.filter(function () { return rand() < 0.15; });
              const hasPhoto = rand() < 0.65;
              list.push({
                recordId: locationId + "-" + year + "-" + i,
                workDate: year + "-" + String(month).padStart(2, "0") + "-" + String(1 + Math.floor(rand() * 27)).padStart(2, "0"),
                recordedAt: year + "-01-01T" + String(Math.floor(rand() * 24)).padStart(2, "0") + ":00:00+09:00",
                workTypes: works.length || hasPhoto ? works : ["水やり"],
                plantTags: rand() < 0.4 ? [plants[Math.floor(rand() * plants.length)]] : [],
                memo: memos[Math.floor(rand() * memos.length)],
                photoFileId: hasPhoto ? "prev_" + (rand() < 0.4 ? "p" : "l") + "_" + locationId + "_" + year + "_" + i : null,
              });
            }
          });
          previewRecordCache[locationId] = list;
        }
        return previewRecordCache[locationId].concat(previewSaved.filter(function (r) { return r.locationId === locationId; }));
      }

      // サーバーの buildAlbum(server/src/album.ts)と同じ規則
      function previewAlbum(locationId, yearParam) {
        const location = previewStore.find(function (l) { return l.id === locationId; });
        if (!location) {
          throw new ApiError(404, "unknown_location");
        }
        const records = previewRecordsFor(locationId);
        const counts = {};
        records.forEach(function (r) { counts[r.workDate.slice(0, 4)] = (counts[r.workDate.slice(0, 4)] || 0) + 1; });
        const years = Object.keys(counts).sort().map(function (y) { return { year: Number(y), count: counts[y] }; });
        const year = yearParam ? Number(yearParam) : years.length ? years[years.length - 1].year : null;
        const inYear = records.filter(function (r) { return Number(r.workDate.slice(0, 4)) === year; })
          .sort(function (a, b) { return a.workDate !== b.workDate ? (a.workDate < b.workDate ? -1 : 1) : (a.recordedAt < b.recordedAt ? -1 : 1); });
        const truncated = params.has("truncated");
        return {
          location: { id: location.id, name: location.name },
          total: records.length,
          years: years,
          year: year,
          photoRecords: inYear.filter(function (r) { return r.photoFileId; }),
          textRecords: inYear.filter(function (r) { return !r.photoFileId; }).reverse(),
          truncated: { photo: truncated, text: truncated },
        };
      }

      // プレビュー: 見本の写真を描く(p=縦長、l=横長)。サムネイルは約0.8秒、元画像は約1.8秒で届く
      async function previewPhoto(fileId, size) {
        await new Promise(function (resolve) { setTimeout(resolve, size === "full" ? 1800 : 800); });
        const saved = previewSaved.find(function (r) { return r.photoFileId === fileId; });
        if (saved) {
          return (await fetch(saved.photoData)).blob();
        }
        const longEdge = size === "full" ? 1000 : 480;
        const portrait = fileId.indexOf("prev_p_") === 0;
        const canvas = document.createElement("canvas");
        canvas.width = portrait ? Math.round(longEdge * 0.75) : longEdge;
        canvas.height = portrait ? longEdge : Math.round(longEdge * 0.75);
        const g = canvas.getContext("2d");
        let seed = fileId.length * 97 + fileId.charCodeAt(fileId.length - 1);
        const rand = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        const hue = 90 + Math.floor(rand() * 60);
        const sky = g.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, "hsl(" + (hue + 60) + ", 35%, 86%)");
        sky.addColorStop(1, "hsl(" + hue + ", 30%, 50%)");
        g.fillStyle = sky;
        g.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 40; i++) {
          g.fillStyle = "hsl(" + (hue + (i % 3) * 8) + ", 38%, " + (30 + (i % 3) * 10) + "%)";
          g.beginPath();
          g.ellipse(rand() * canvas.width, canvas.height * (0.55 + rand() * 0.4), canvas.width * 0.12, canvas.width * 0.05, rand() * 3, 0, Math.PI * 2);
          g.fill();
        }
        return new Promise(function (resolve) { canvas.toBlob(resolve, "image/jpeg", 0.85); });
      }

      function api(method, path, body) {
        return previewCount !== null ? previewApi(method, path, body) : callApi(method, path, body);
      }

      // 写真の中身(IDトークンを付けてサーバーから取得する。Driveの共有設定は変えない)
      async function fetchPhoto(fileId, size) {
        if (previewCount !== null) {
          return previewPhoto(fileId, size);
        }
        const response = await fetch(API_BASE + "/api/photos/" + encodeURIComponent(fileId) + "?size=" + size, {
          headers: { Authorization: "Bearer " + liff.getIDToken() },
        });
        if (!response.ok) {
          throw new ApiError(response.status, "photo_" + response.status);
        }
        return response.blob();
      }

      // ---- 読み込み・登録 ----
      async function refreshLocations() {
        try {
          const data = await api("GET", "/api/locations");
          setStatus("");
          setLocations(data.locations || []);
          if (mode === "album") {
            loadLocationCounts();
          }
        } catch (error) {
          console.error("場所の取得エラー", error);
          setStatus(messageFor(error), true, refreshLocations);
        }
      }

      addButton.addEventListener("click", function () {
        openAddForm(false);
        nameInput.focus();
      });

      document.getElementById("cancelAdd").addEventListener("click", closeAddForm);

      addForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const validation = normalizeName(nameInput.value);
        if (!validation.ok) {
          nameError.textContent = validation.message;
          nameError.classList.remove("hidden");
          return;
        }
        if (!liffReady && previewCount === null) {
          return;
        }

        submitAdd.disabled = true;
        submitAdd.textContent = "登録しています…";
        try {
          const data = await api("POST", "/api/locations", { name: validation.name });
          if (!locations.some(function (l) { return l.id === data.location.id; })) {
            setLocations(locations.concat([data.location]));
          }
          closeAddForm();
          openRecord(data.location, data.created ? "" : "すでに登録されている場所です。");
        } catch (error) {
          console.error("場所の登録エラー", error);
          nameError.textContent = error instanceof ApiError && error.code === "invalid_name"
            ? "この名前は登録できません。"
            : messageFor(error).replace("読み込めませんでした", "登録できませんでした");
          nameError.classList.remove("hidden");
        } finally {
          submitAdd.disabled = false;
          submitAdd.textContent = "登録する";
        }
      });

      // ---- 記録画面 ----
      const record = {
        location: null,
        workDate: "",
        workTypes: [],
        tags: [],
        photo: null, // { base64, url, bytes, quality }
        photoBusy: false,
        moreOpen: false,
        // 保存に失敗したら同じ記録IDのまま再送する(サーバーは同じ記録IDを二重に保存しない)
        pendingRecordId: null,
        saving: false,
      };

      // 日本時間の今日(YYYY-MM-DD)。サーバーが確かめる作業日の上限と同じ基準
      function todayJst() {
        return new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
      }

      // 保存はISO形式、表示は 2026/09/27 形式(docs/sodalog-spec.md 12.7節)
      function formatDate(iso) {
        return iso.replace(/-/g, "/") + (iso === todayJst() ? "（今日）" : "");
      }

      function newRecordId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        const bytes = window.crypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
        return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
      }

      // 記録画面の場所名: 8文字まで 21px / 14文字まで 18px / それ以上 16px(2行まで)
      function placeSizeClass(name) {
        const length = Array.from(name).length;
        return length <= 8 ? "" : length <= 14 ? "size-m" : "size-s";
      }

      function applyTone(tone) {
        TONE_VARS.forEach(function (name) {
          document.body.style.setProperty("--c-" + name, tone[name]);
        });
      }

      function memoLength() {
        return Array.from(memoInput.value.replace(/\r\n?/g, "\n").trim()).length;
      }

      // 記録の成立条件: 場所 + (写真・作業内容・植物・メモのどれか1つ以上)
      function hasContent() {
        return Boolean(
          record.photo ||
          record.workTypes.length > 0 ||
          record.tags.length > 0 ||
          tagInput.value.trim() !== "" ||
          memoInput.value.trim() !== ""
        );
      }

      function showFieldError(element, message) {
        element.textContent = message || "";
        element.classList.toggle("hidden", !message);
      }

      function renderWorkDate() {
        const text = formatDate(record.workDate);
        document.getElementById("workDateText").textContent = text;
        document.getElementById("workDateButton").setAttribute("aria-label", "作業日 " + text + "。押すと変更できます");
      }

      function renderWorkChips() {
        const container = document.getElementById("workChips");
        container.replaceChildren();
        WORK_TYPES.forEach(function (workType) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "work-cell";
          chip.textContent = workType;
          chip.setAttribute("aria-pressed", String(record.workTypes.includes(workType)));
          chip.addEventListener("click", function () {
            if (record.saving) {
              return;
            }
            record.workTypes = record.workTypes.includes(workType)
              ? record.workTypes.filter(function (w) { return w !== workType; })
              : record.workTypes.concat([workType]);
            renderWorkChips();
            updateSaveState();
          });
          container.append(chip);
        });
      }

      function renderTags() {
        const container = document.getElementById("tags");
        container.replaceChildren();
        record.tags.forEach(function (tag) {
          const item = document.createElement("span");
          item.className = "tag";
          item.append(document.createTextNode(tag));
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "×";
          remove.setAttribute("aria-label", tag + " を外す");
          remove.addEventListener("click", function () {
            if (record.saving) {
              return;
            }
            record.tags = record.tags.filter(function (t) { return t !== tag; });
            renderTags();
            updateSaveState();
          });
          item.append(remove);
          container.append(item);
        });
      }

      // サーバーと同じ規則(NFKC・前後の空白除去・1つ20文字まで・10個まで・重複は除く)
      function addTagFromInput() {
        const tag = tagInput.value.normalize("NFKC").trim();
        if (!tag) {
          tagInput.value = "";
          showFieldError(tagError, "");
          return true;
        }
        if (/[\u0000-\u001f\u007f]/.test(tag)) {
          showFieldError(tagError, "使えない文字が含まれています。");
          return false;
        }
        if (Array.from(tag).length > TAG_MAX_LENGTH) {
          showFieldError(tagError, "1つ20文字以内で入力してください。");
          return false;
        }
        if (!record.tags.includes(tag)) {
          if (record.tags.length >= TAG_MAX_COUNT) {
            showFieldError(tagError, "植物は10個までです。");
            return false;
          }
          record.tags = record.tags.concat([tag]);
        }
        tagInput.value = "";
        showFieldError(tagError, "");
        renderTags();
        updateSaveState();
        return true;
      }

      function renderMemoCounter() {
        const length = memoLength();
        const counter = document.getElementById("memoCounter");
        counter.textContent = length + " / " + MEMO_MAX_LENGTH;
        counter.classList.toggle("over", length > MEMO_MAX_LENGTH);
      }

      function renderPhoto() {
        const hasPhoto = Boolean(record.photo);
        const button = document.getElementById("photoButton");
        button.classList.toggle("hidden", hasPhoto);
        button.disabled = record.photoBusy;
        document.getElementById("photoButtonText").textContent = record.photoBusy ? "写真を準備しています…" : "写真を撮る・選ぶ";
        document.getElementById("photoPreview").classList.toggle("hidden", !hasPhoto);
        const image = document.getElementById("photoImage");
        if (hasPhoto) {
          image.src = record.photo.url;
        } else {
          image.removeAttribute("src");
        }
      }

      function setMoreOpen(open) {
        record.moreOpen = open;
        document.getElementById("fold").classList.toggle("open", open);
        document.getElementById("moreArea").classList.toggle("hidden", !open);
        document.getElementById("moreToggle").setAttribute("aria-expanded", String(open));
        updateSaveState();
      }

      function renderMoreMeta() {

      // 保存欄の要約(例: 水やり・剪定・写真1枚・植物2・メモ)

          bold.textContent = works.join("・");
          summary.append(bold);
          if (rest.length) {
            summary.append(document.createTextNode("・"));

        summary.append(document.createTextNode(rest.join("・")));

      // ---- 作業日のカレンダー(画面の下から出るシート) ----
      // 日を押しただけでは決まらず「この日にする」で決定。閉じる・キャンセル・背景・Esc は元の日付のまま。
      // 過去はさかのぼり制限なし、未来の日は選べない。
      const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

      function openCalendar() {
        if (record.saving || document.querySelector(".cal-overlay")) {
          return;
        }
        const opener = document.getElementById("workDateButton");
        const today = todayJst();
        let picked = record.workDate;
        let view = picked.slice(0, 7);

        const overlay = document.createElement("div");
        overlay.className = "cal-overlay";
        overlay.innerHTML =
          '<div class="cal-sheet" role="dialog" aria-modal="true" aria-label="作業日を選ぶ">' +
          '<div class="cal-top"><p class="cal-title">作業日を選ぶ</p>' +
          '<button class="cal-close" type="button" data-cal-close><span aria-hidden="true">×</span>閉じる</button></div>' +
          '<div class="cal-picked">選択中<b data-cal-picked></b></div>' +
          '<div class="cal-nav">' +
          '<button type="button" data-cal-prev aria-label="前の月">‹</button>' +
          '<span class="month" data-cal-month aria-live="polite"></span>' +
          '<button type="button" data-cal-next aria-label="次の月">›</button></div>' +
          '<div class="cal-grid" data-cal-grid></div>' +
          '<div class="cal-legend"><span><i class="l-today"></i>今日</span><span><i class="l-selected"></i>選んでいる日</span></div>' +
          '<button class="cal-today-link" type="button" data-cal-today>今日にする</button>' +
          '<div class="cal-actions">' +
          '<button class="cancel" type="button" data-cal-close>キャンセル</button>' +
          '<button class="ok" type="button" data-cal-ok>この日にする</button></div>' +
          "</div>";
        document.body.append(overlay);
        document.documentElement.classList.add("sheet-open");

        function render() {
          const parts = view.split("-").map(Number);
          const year = parts[0];
          const month = parts[1];
          overlay.querySelector("[data-cal-month]").textContent = year + "年" + month + "月";
          overlay.querySelector("[data-cal-picked]").textContent = formatDate(picked);
          overlay.querySelector("[data-cal-next]").disabled = view >= today.slice(0, 7);

          const grid = overlay.querySelector("[data-cal-grid]");
          grid.replaceChildren();
          WEEKDAYS.forEach(function (name, i) {
            const cell = document.createElement("div");
            cell.className = "cal-week" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
            cell.textContent = name;
            grid.append(cell);
          });
          const offset = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
          const days = new Date(Date.UTC(year, month, 0)).getUTCDate();
          for (let i = 0; i < offset; i++) {
            grid.append(document.createElement("span"));
          }
          for (let day = 1; day <= days; day++) {
            const iso = year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
            const weekday = (offset + day - 1) % 7;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "cal-day" + (weekday === 0 ? " sun" : weekday === 6 ? " sat" : "");
            button.disabled = iso > today;
            const inner = document.createElement("span");
            inner.append(document.createTextNode(String(day)));
            if (iso === today) {
              button.classList.add("today");
              const mark = document.createElement("span");
              mark.className = "today-mark";
              mark.textContent = "今日";
              inner.append(mark);
            }
            button.append(inner);
            if (iso === picked) {
              button.classList.add("selected");
              button.setAttribute("aria-pressed", "true");
            }
            button.setAttribute("aria-label", month + "月" + day + "日" + (iso === today ? "（今日）" : ""));
            button.addEventListener("click", function () {
              picked = iso;
              render();
            });
            grid.append(button);
          }
        }

        function shiftMonth(delta) {
          const parts = view.split("-").map(Number);
          view = new Date(Date.UTC(parts[0], parts[1] - 1 + delta, 1)).toISOString().slice(0, 7);
          render();
        }

        function close() {
          overlay.remove();
          document.documentElement.classList.remove("sheet-open");
          document.removeEventListener("keydown", onKey);
          opener.focus({ preventScroll: true });
        }

        function onKey(event) {
          if (event.key === "Escape") {
            close();
          }
        }

        overlay.addEventListener("click", function (event) {
          if (event.target === overlay || event.target.closest("[data-cal-close]")) {
            close();
          } else if (event.target.closest("[data-cal-prev]")) {
            shiftMonth(-1);
          } else if (event.target.closest("[data-cal-next]")) {
            shiftMonth(1);
          } else if (event.target.closest("[data-cal-today]")) {
            picked = today;
            view = today.slice(0, 7);
            render();
          } else if (event.target.closest("[data-cal-ok]")) {
            // 開いている間に日付をまたいだ場合も未来にはしない
            record.workDate = picked <= todayJst() ? picked : todayJst();
            renderWorkDate();
            close();
          }
        });
        document.addEventListener("keydown", onKey);
        render();
        overlay.querySelector(".cal-day.selected, [data-cal-close]").focus({ preventScroll: true });
      }

      // ---- 写真: 選んだときだけ読み込み、端末上で縮小・JPEG化する ----
      function loadImage(file) {
        return new Promise(function (resolve, reject) {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = function () {
            URL.revokeObjectURL(url);
            resolve(image);
          };
          image.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("decode_failed"));
          };
          image.src = url;
        });
      }

      function canvasToJpeg(canvas, quality) {
        return new Promise(function (resolve, reject) {
          canvas.toBlob(function (blob) {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("encode_failed"));
            }
          }, "image/jpeg", quality);
        });
      }

      function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onload = function () {
            resolve(String(reader.result).split(",")[1] || "");
          };
          reader.onerror = function () {
            reject(new Error("read_failed"));
          };
          reader.readAsDataURL(blob);
        });
      }

      /*
       * 長辺1600pxに縮小し、JPEG(品質0.8、3MBを超えたら0.7→0.6)にする。
       * HEICなども、端末が表示できる形式ならここでJPEGになる。
       * 描き直すため、撮影位置などのEXIF情報は送らない。
       */
      async function compressPhoto(file) {
        const image = await loadImage(file);
        const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);

        for (const quality of PHOTO_QUALITIES) {
          const blob = await canvasToJpeg(canvas, quality);
          if (blob.size <= PHOTO_MAX_BYTES) {
            return { blob: blob, quality: quality };
          }
        }
        throw new Error("too_large");
      }

      async function handlePhotoFile(file) {
        const photoStatus = document.getElementById("photoStatus");
        showFieldError(photoStatus, "");
        setPhoto(null);
        record.photoBusy = true;
        renderPhoto();
        updateSaveState();
        try {
          const result = await compressPhoto(file);
          const base64 = await blobToBase64(result.blob);
          record.photoBusy = false;
          setPhoto({
            base64: base64,
            url: URL.createObjectURL(result.blob),
            bytes: result.blob.size,
            quality: result.quality,
          });
        } catch (error) {
          console.error("写真の準備エラー", error);
          record.photoBusy = false;
          showFieldError(
            photoStatus,
            error.message === "too_large"
              ? "写真が大きすぎて保存できません。別の写真を選んでください。"
              : "この写真は読み込めませんでした。別の写真を選んでください。",
          );
          renderPhoto();
          updateSaveState();
        }
      }

      // ---- 保存 ----
      function recordErrorMessage(error) {
        if (error instanceof ApiError) {
          if (error.status === 401) {
            return "LINEの認証が切れました。LINEから開き直してください。";
          }
          if (error.status === 403) {
            return "このアカウントでは利用できません。";
          }
          if (error.code === "unknown_location") {
            return "この場所が見つかりませんでした。場所を選び直してください。";
          }
          if (error.code === "photo_too_large" || error.status === 413) {
            return "写真が大きすぎて保存できませんでした。別の写真を選んでください。";
          }
          if (error.code === "invalid_photo") {
            return "写真を保存できませんでした。別の写真を選んでください。";
          }
          if (error.code === "invalid_record" || error.code === "empty_record") {
            return "入力内容を保存できませんでした。内容を確認してください。";
          }
          if (error.code === "storage_not_initialized") {
            return "保存先が準備されていません。";
          }
        }
        return "保存できませんでした。通信状況を確認して、もう一度保存してください。";
      }

      function leaveRecord() {

      async function saveRecord() {
        if (record.saving || record.photoBusy) {

          recordId: record.pendingRecordId,
          workDate: record.workDate,

          workTypes: WORK_TYPES.filter(function (w) { return record.workTypes.includes(w); }),
          plantTags: record.tags,
          memo: memoInput.value,
        };
        if (record.photo) {
          body.photo = { mimeType: "image/jpeg", data: record.photo.base64 };
        }

        record.saving = true;
        saveError.classList.add("hidden");
        updateSaveState();
        try {
          await api("POST", "/api/records", body);

      // ---- アルバム(STEP 4-4b。docs/design/album-screen-board.html Round 3 の確定版) ----
      const albumScreen = document.getElementById("albumScreen");
      const albumBody = document.getElementById("albumBody");
      const ALBUM_PHOTO_PARALLEL = 4; // 一覧の写真は、見えてきたものから同時に4枚まで読み込む
      const album = {
        location: null,
        cache: {},        // "場所ID|年"(年を省略したときは "場所ID|") → API の応答
        request: 0,       // 古い応答で画面を上書きしないための番号
        observer: null,
        queue: [],
        running: 0,
      };
      const thumbUrls = {}; // 写真ファイルID → 読み込んだサムネイル(同じ画面を開いている間は使い回す)

      const INFO_ICON =
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">' +
        '<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor"/></svg>';

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function slashDate(iso) {
